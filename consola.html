:root{
  /* Paleta Sage (Brand Guidelines 2026) + color propio por recurso */
  --navy:#001A69; --navy-deep:#00124A; --surface:#0A2C74; --surface-2:#12398A;
  --coral:#F86A78;  /* Sage Journals */
  --peri:#86B8FF;   /* Sage Books & Reference */
  --orange:#FFA55F; /* Sage Business */
  --teal:#08C9C4;   /* Sage Highlight Teal */
  --blue:#348AF7;   /* Sage Highlight Blue */
  --pale:#D9EEFF; --white:#FFFFFF; --muted:#9FB8DE;
  --seam:rgba(217,238,255,.16); --seam-2:rgba(217,238,255,.30);
  --ok:#3DDC97; --bad:#FF8A8A;
  --peak:'Sage Peak','Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --sans:'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --navy:#001A69; --pale:#D9EEFF; } }
:root[data-theme="dark"]{ --navy:#001A69; --pale:#D9EEFF; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--sans);color:var(--pale);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(120% 80% at 8% -10%, rgba(52,138,247,.18), transparent 55%),
    radial-gradient(110% 80% at 100% 0%, rgba(8,201,196,.12), transparent 50%),
    radial-gradient(90% 60% at 50% 110%, rgba(255,165,95,.07), transparent 60%),
    var(--navy);
  background-attachment:fixed;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pale);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1320px;margin:0 auto;padding:18px clamp(14px,3vw,28px) 40px}

/* ---------- Controles comunes ---------- */
.panel{background:var(--surface);border:1px solid var(--seam);border-radius:16px;padding:20px}
.step{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.step b{font-size:13px;font-weight:800;color:var(--navy);background:var(--pale);border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center;flex:none}
.step h2{margin:0;font-size:17px;font-weight:700;color:var(--white)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}
.input,select.input,textarea.input{width:100%;background:var(--navy-deep);border:1px solid var(--seam-2);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--white)}
select.input option,select.input optgroup{background:#0A2C74;color:#fff}
.input:focus{border-color:var(--pale);outline:none}
.input.err{border-color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:16px;line-height:1.4}
.hint.bad{color:var(--bad)} .hint.ok{color:var(--ok)}
.btn{border:1px solid var(--seam-2);background:var(--surface-2);color:var(--white);border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--pale)}
.btn.primary{background:var(--pale);color:var(--navy);border-color:var(--pale)}
.btn.primary:hover{background:var(--white)}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(255,138,138,.5);color:var(--bad);background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.big{padding:15px 22px;font-size:17px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--seam-2);color:var(--pale);white-space:nowrap}
.rcard{background:var(--c);border-radius:12px;padding:14px 16px;color:#001A69}
.rcard img{display:block;width:min(170px,100%);height:auto}
.rcard small{display:block;margin-top:8px;font-size:13px;font-weight:700;color:#001A69}
.sagelogo{height:34px;width:auto;display:block}
.ribbon{display:inline-block;background:var(--teal);color:#001A69;padding:.02em .35em .1em;border-radius:3px 3px 3px 3px/9px 9px 4px 4px;transform:rotate(-1.2deg);margin-left:.1em}

/* ---------- Combo de instituciones ---------- */
.combo-list{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--seam-2);border-radius:10px;overflow:hidden;background:var(--navy-deep)}
.combo-list li+li{border-top:1px solid var(--seam)}
.combo-list button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;font-size:15px;color:var(--white);line-height:1.3}
.combo-list button:hover,.combo-list button:focus-visible{background:var(--surface-2)}
.combo-list .other{color:var(--pale);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
details.refbox{border:1px dashed var(--seam-2);border-radius:12px;padding:12px 14px;margin:6px 0 16px;background:rgba(0,18,74,.45)}
details.refbox summary{cursor:pointer;font-weight:700;color:var(--white);font-size:15px;line-height:1.35}
details.refbox summary small{display:block;font-weight:600;color:var(--muted);font-size:12.5px;margin-top:2px}
.refrow{border-top:1px solid var(--seam);padding-top:12px;margin-top:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;font-weight:400;line-height:1.45;color:var(--pale);margin:4px 0 14px}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:#08C9C4}
.errbox{border:1px solid var(--bad);background:rgba(255,138,138,.1);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--white);margin-bottom:12px}

/* ---------- Modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,10,40,.72);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--seam-2);border-radius:16px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}
.modal.wide{width:min(720px,100%)}
.modal h3{margin:0 0 10px;font-size:19px;color:var(--white)}
.modal p{margin:0 0 14px;font-size:15px;line-height:1.5}
.modal .row.end{justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pale);color:var(--navy);font-weight:700;padding:10px 18px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw;text-align:center}
.vwrap{border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-bottom:10px}
.vwrap video{width:100%;height:100%;object-fit:cover;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}




/* ---------- Barra superior ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--seam);margin-bottom:22px}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand .rule{width:1px;height:36px;background:var(--seam-2)}
.brand h1{margin:0;font-size:19px;font-weight:700;color:var(--white);line-height:1.2}
.brand p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--navy-deep);border:1px solid var(--seam);border-radius:12px;padding:4px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--white)}
.saved{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.saved i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}

/* ---------- Jugar ---------- */
.play{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;align-items:start}
@media (max-width:900px){.play{grid-template-columns:1fr}}
.shots{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--pale)}
.ball{width:18px;height:18px;border-radius:50%;border:2px solid var(--pale);display:inline-block}
.ball.used{background:var(--pale)}
.pcard{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--navy-deep);border:1px dashed var(--seam-2);font-size:14px;line-height:1.5}
.pcard strong{color:var(--white);font-size:16px}
.results{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--seam-2);border-radius:10px;overflow:hidden}
.results li+li{border-top:1px solid var(--seam)}
.results button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;border:0;background:var(--navy-deep);padding:10px 12px}
.results button:hover{background:var(--surface-2)}
.results b{color:var(--white);font-size:15px}
.results span{font-size:12.5px;color:var(--muted)}
.results .ct{grid-row:1/3;grid-column:2;align-self:center;font-weight:800;color:var(--white);font-size:13px}
.results button:disabled{opacity:.45;cursor:not-allowed}
.canchas{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.cancha{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:14px;text-align:left;border:3px solid transparent;background:var(--c);border-radius:14px;padding:16px 16px 14px;color:#001A69;min-height:116px}
.cancha img.rl{width:min(170px,100%);height:auto;display:block}
.cancha .tg{font-size:13px;font-weight:700;color:#001A69}
.cancha[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35),0 8px 24px rgba(0,0,0,.35)}
.cancha:disabled{opacity:.35;cursor:not-allowed}
@media (max-width:700px){.canchas{grid-template-columns:1fr}}
.goal-wrap{border-radius:14px}
svg.goal{width:100%;height:auto;display:block}
.goal .post{fill:none;stroke:var(--white);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.goal .ground{stroke:rgba(217,238,255,.35);stroke-width:3}
.goal .divider{stroke:var(--pale);stroke-width:5;stroke-dasharray:14 9;opacity:.55}
.goal .zone rect{fill:transparent;transition:fill .15s}
.goal.selectable .zone{cursor:pointer}
.goal.selectable .zone:hover rect{fill:rgba(217,238,255,.10)}
.goal .zone.sel rect{fill:var(--zc)}
.goal .zone text{fill:var(--pale);text-anchor:middle;pointer-events:none;font-family:var(--sans)}
.goal .zone .pts{font-size:34px;font-weight:800;fill:var(--white)}
.goal .zone .zn{font-size:15px;font-weight:700}
.goal .zone .zd{font-size:13px;opacity:.8}
.goal .zone.sel text{fill:var(--navy)}
.goal-wrap.off{opacity:.35}
.goal-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:14px}
.selinfo{font-size:14px;color:var(--pale)}
.selinfo strong{color:var(--white)}

/* Pregunta */
.qhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:16px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:5px 12px;background:var(--c,var(--surface-2));color:var(--navy)}
.tag.dim{background:var(--navy-deep);color:var(--pale);border:1px solid var(--seam-2)}
.ptsnow{font-size:15px;color:var(--muted)}
.ptsnow strong{font-size:30px;color:var(--white);font-weight:800;margin-right:4px}
.qbanner{height:96px;border-radius:12px;background-size:cover;background-position:center;display:flex;align-items:center;padding:0 20px;margin-bottom:16px}
.qbanner img{height:34px;width:auto;display:block;max-width:60%}
.panel .qtext{font-size:clamp(22px,2.6vw,32px);font-weight:700;line-height:1.3;color:var(--white);margin:4px 0 20px;max-width:62ch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--seam-2);background:var(--navy-deep);border-radius:12px;padding:14px;font-size:16px;line-height:1.35;color:var(--white)}
.opt .l{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);font-weight:800;font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--pale);background:var(--surface-2)}
.opt[aria-pressed="true"] .l{background:var(--pale);color:var(--navy)}
.opt.correct{border-color:var(--ok);background:rgba(61,220,151,.14)}
.opt.correct .l{background:var(--ok);color:var(--navy)}
.opt.wrong{border-color:var(--bad);background:rgba(255,138,138,.12)}
.opt:disabled{cursor:default}
.hints{margin-top:18px;display:grid;gap:8px}
.hintbox{background:var(--navy-deep);border-left:4px solid var(--pale);border-radius:8px;padding:10px 14px;font-size:15px;line-height:1.45}
.hintbox b{color:var(--white)}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px solid var(--seam)}
.verdict{margin-top:18px;border-radius:14px;padding:18px 20px;border:2px solid}
.verdict.ok{border-color:var(--ok);background:rgba(61,220,151,.10)}
.verdict.bad{border-color:var(--bad);background:rgba(255,138,138,.08)}
.verdict h3{margin:0 0 6px;font-size:22px;color:var(--white)}
.panel .verdict p{margin:0;font-size:16px;line-height:1.5;color:var(--pale)}
.fac-answer{font-size:13px;color:var(--muted)}

/* ---------- Proyección ---------- */
.proj{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:18px}
@media (max-width:1100px){.proj{grid-template-columns:1fr 1fr}}
@media (max-width:720px){.proj{grid-template-columns:1fr}}
.proj-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}
.proj-head h2{margin:0;font-size:clamp(26px,3.2vw,44px);font-weight:800;color:var(--white);line-height:1.05;letter-spacing:-.01em}
.proj-head p{margin:6px 0 0;color:var(--muted);font-size:15px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:var(--navy-deep);border:1px solid var(--seam);border-radius:12px;padding:10px 16px;min-width:104px}
.kpi b{display:block;font-size:30px;font-weight:800;color:var(--white);line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.ptitle{margin:0 0 14px;font-size:17px;font-weight:700;color:var(--white)}
.rank{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--seam)}
.rank li:last-child{border-bottom:0}
.rank .pos{font-weight:800;font-size:18px;color:var(--muted);text-align:center}
.rank li:nth-child(1) .pos{color:var(--navy);background:var(--pale);border-radius:8px;padding:2px 0}
.rank .who{min-width:0}
.rank .who b{display:block;color:var(--white);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .who span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rank .sc{font-weight:800;font-size:20px;color:var(--white)}
.duel{display:grid;gap:12px}
.duel .side{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
.duel .side b{display:flex;align-items:center;min-height:26px}
.duel .dl{height:24px;width:auto;display:block}
.duel .side strong{font-size:24px;color:var(--white)}
.bar{grid-column:1/-1;height:12px;border-radius:6px;background:var(--navy-deep);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:6px;transition:width .4s}
.duel small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:8px 0;border-bottom:1px solid var(--seam);font-size:14px;line-height:1.4}
.feed li:last-child{border-bottom:0}
.feed .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.projbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:10px}
body.projecting .top{display:none}
body.projecting .wrap{max-width:none}

/* ---------- Tablas / datos ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--seam);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:900px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--seam);vertical-align:top}
th{background:var(--navy-deep);color:var(--muted);font-weight:700;position:sticky;top:0}
td .del{border:0;background:transparent;color:var(--bad);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.panel h3{margin:0 0 8px;font-size:17px;color:var(--white)}
.panel p{margin:0 0 14px;font-size:14px;line-height:1.5;color:var(--pale)}
.qrpanel{background:#fff;border-radius:14px;padding:10px;width:min(280px,100%);margin:12px 0}
.qrpanel svg{display:block;width:100%;height:auto}
.bankq{border-top:1px solid var(--seam);padding:14px 0}
.bankq h4{margin:0 0 6px;font-size:15px;color:var(--white);line-height:1.4}
.bankq ol{margin:6px 0;padding-left:22px;font-size:14px}
.bankq li.right{color:var(--ok);font-weight:700}
.bankq .meta{font-size:12.5px;color:var(--muted);line-height:1.5}

/* ================== Configuración (config.js) y Supabase ================== */
const CFG=(typeof window!=='undefined'&&window.SAGE_CONFIG)||{};
function sbReady(){
  const u=String(CFG.supabaseUrl||''),k=String(CFG.supabaseKey||'');
  return /^https?:\/\/[^\s]+$/.test(u)&&!/X{4,}/i.test(u)&&k.length>20&&!/X{4,}/.test(k);
}
async function sbRpc(fn,body,timeoutMs){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),timeoutMs||12000);
  const headers={'Content-Type':'application/json','apikey':CFG.supabaseKey};
  if(String(CFG.supabaseKey).startsWith('eyJ'))headers['Authorization']='Bearer '+CFG.supabaseKey;
  try{
    const r=await fetch(String(CFG.supabaseUrl).replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers,body:JSON.stringify(body),signal:ctl.signal});
    const txt=await r.text();let data=null;try{data=txt?JSON.parse(txt):null;}catch(e){}
    if(!r.ok){const e=new Error((data&&(data.message||data.error||data.hint))||('http_'+r.status));e.status=r.status;throw e;}
    return data;
  }catch(e){if(e&&e.name==='AbortError'){const x=new Error('timeout');x.status=0;throw x;}throw e;}
  finally{clearTimeout(t);}
}

function openModal(build,wide){
  const scrim=document.createElement('div');scrim.className='scrim';
  const m=document.createElement('div');m.className='modal'+(wide?' wide':'');m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');
  scrim.appendChild(m);document.body.appendChild(scrim);
  const close=()=>scrim.remove();
  build(m,close);

  scrim.addEventListener('keydown',e=>{if(e.key==='Escape'){const c=m.querySelector('[data-cancel]');if(c)c.click();else close();}});
  return close;
}
function confirmBox(title,msg,okLabel='Aceptar',danger=false){
  return new Promise(res=>openModal((m,close)=>{

    m.querySelector('[data-cancel]').onclick=()=>{close();res(false);};
    m.querySelector('[data-ok]').onclick=()=>{close();res(true);};
  }));
}

function parseInst(lines){
  return (lines||[]).map(l=>{const i=String(l).lastIndexOf('|');const n=(i<0?l:l.slice(0,i)).trim();const t=i<0?'':l.slice(i+1).trim();return n?{name:n,type:t,key:norm(n)}:null;}).filter(Boolean);
}

/* ================== Jugador y pase ================== */
function cleanPlayer(p){
  const email=clip(p.email,120).toLowerCase();
  if(!emailRe.test(email))return null;
  const nombres=clip(p.nombres,80),apellidos=clip(p.apellidos,80);
  if(nombres.length<2||apellidos.length<2)return null;
  const refs=[];
  (p.referrals||[]).forEach(r=>{
    if(refs.length>=MAXREF||!r)return;
    const n=clip(r.name,100),e=clip(r.email,120).toLowerCase();
    if(n.length>=3&&emailRe.test(e)&&e!==email&&!refs.some(x=>x.email===e))refs.push({name:n,email:e,cargo:clip(r.cargo,60)});
  });
  return{id:email,email,nombres,apellidos,name:nombres+' '+apellidos,institution:clip(p.institution,140),instType:clip(p.instType,20),cargo:clip(p.cargo,60),referrals:refs,consent:!!p.consent,createdAt:+p.createdAt||Date.now()};
}
function b64uEnc(str){const b=new TextEncoder().encode(str);let s='';b.forEach(x=>{s+=String.fromCharCode(x);});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64uDec(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t);const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return new TextDecoder().decode(b);}
function encodePass(p){
  const arr=[1,p.nombres,p.apellidos,p.email,p.institution,p.instType||'',p.cargo||'',(p.referrals||[]).map(r=>[r.name,r.email,r.cargo||'']),p.consent?1:0,p.createdAt||Date.now()];
  return 'SGP1.'+b64uEnc(JSON.stringify(arr));
}
function decodePass(text){
  const m=String(text||'').match(/SGP1\.[A-Za-z0-9_-]+/);if(!m)return null;
  try{
    const arr=JSON.parse(b64uDec(m[0].slice(5)));
    if(!Array.isArray(arr)||arr[0]!==1)return null;
    const refs=Array.isArray(arr[7])?arr[7].map(r=>({name:r[0],email:r[1],cargo:r[2]})):[];
    return cleanPlayer({nombres:arr[1],apellidos:arr[2],email:arr[3],institution:arr[4],instType:arr[5],cargo:arr[6],referrals:refs,consent:!!arr[8],createdAt:arr[9]});
  }catch(e){return null;}
}
/* QR en SVG (negro sobre blanco, con margen). Devuelve null si la librería no cargó. */
function qrSVG(text){
  if(typeof qrcode!=='function')return null;
  try{
    const q=qrcode(0,'L');q.addData(String(text));q.make();
    const n=q.getModuleCount(),m=4;let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+(c+m)+' '+(r+m)+'h1v1h-1z';
    const sz=n+2*m;
    return `<svg viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" role="img" aria-label="Código QR"><rect width="${sz}" height="${sz}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }catch(e){return null;}
}

    <ul class="combo-list" id="rfInstList" role="listbox" hidden></ul>
    <div id="rfInstExtra" hidden style="margin-top:10px"><label for="rfInstType">Tipo de institución</label>
      <select class="input" id="rfInstType"><option value="">Seleccione…</option><option>Pública</option><option>Privada</option><option>Otra</option></select></div>
    <div class="hint" id="rfInstHint"></div>`;
  const inp=$('#rfInst',host),ul=$('#rfInstList',host),extra=$('#rfInstExtra',host),sel=$('#rfInstType',host),hint=$('#rfInstHint',host);
  const exact=()=>list.find(i=>i.key===norm(st.name));
  function sync(){
    const hit=exact();
    if(hit){st.type=hit.type;extra.hidden=true;hint.className='hint ok';hint.textContent='✓ '+(hit.type||'Institución')+' · seleccionada de la lista';}
    else if(clip(st.name,200).length>=3){extra.hidden=false;sel.value=st.type||'';hint.className='hint';hint.textContent='Institución fuera de la lista: se registrará tal como la escribió.';}
    else{extra.hidden=true;hint.className='hint';hint.textContent='';}
    onChange(st);
  }
  function showList(){
    const q=norm(inp.value);
    if(!q){ul.hidden=true;inp.setAttribute('aria-expanded','false');return;}
    const toks=q.split(/\s+/);
    let hits=list.filter(i=>toks.every(t=>i.key.includes(t)));
    hits.sort((a,b)=>(b.key.startsWith(q)-a.key.startsWith(q))||a.name.localeCompare(b.name,'es'));
    hits=hits.slice(0,8);
    ul.innerHTML=hits.map((h,i)=>`<li role="option"><button type="button" data-i="${i}"><span>${esc(h.name)}</span>${h.type?`<span class="chip">${esc(h.type)}</span>`:''}</button></li>`).join('')+
      (clip(inp.value,200).length>=3?`<li role="option"><button type="button" class="other" data-other="1">Mi institución no aparece: usar «${esc(clip(inp.value,60))}»</button></li>`:'');
    ul.hidden=!ul.innerHTML;inp.setAttribute('aria-expanded',String(!ul.hidden));
    ul._hits=hits;
  }
  inp.addEventListener('input',()=>{st.name=inp.value;st.type='';showList();sync();});
  inp.addEventListener('keydown',e=>{if(e.key==='Escape'){ul.hidden=true;}});
  inp.addEventListener('blur',()=>setTimeout(()=>{ul.hidden=true;},180));
  ul.addEventListener('mousedown',e=>e.preventDefault());
  ul.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.other){ul.hidden=true;sync();sel.focus();return;}
    const h=ul._hits[+b.dataset.i];if(!h)return;
    st.name=h.name;st.type=h.type;inp.value=h.name;ul.hidden=true;sync();
  });
  sel.addEventListener('change',()=>{st.type=sel.value;onChange(st);});
  sync();
}

/* ================== Formulario de registro (celular y consola) ================== */
function regForm(host,opt){
  const o=Object.assign({initial:null,lockEmail:false,submitLabel:'Continuar',instList:DEFAULT_INST,withConsent:true,onSubmit:()=>{}},opt||{});
  const ini=o.initial||{};
  const list=parseInst(o.instList);
  const st={name:ini.institution||'',type:ini.instType||''};
  const refs0=(ini.referrals||[]);
  const opts=(arr,sel)=>'<option value="">Seleccione…</option>'+arr.map(c=>`<option ${c===sel?'selected':''}>${esc(c)}</option>`).join('');
  host.innerHTML=`
  <div class="rform">
    <div class="field"><label for="rfInst">Institución</label><div id="rfInstHost"></div></div>
    <div class="two">
      <div class="field"><label for="rfNom">Nombres</label><input id="rfNom" class="input" maxlength="80" autocomplete="given-name" autocapitalize="words" value="${esc(ini.nombres||'')}"></div>
      <div class="field"><label for="rfApe">Apellidos</label><input id="rfApe" class="input" maxlength="80" autocomplete="family-name" autocapitalize="words" value="${esc(ini.apellidos||'')}"></div>
    </div>
    <div class="field"><label for="rfMail">Correo electrónico</label><input id="rfMail" class="input" maxlength="120" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="nombre@institucion.edu.ec" value="${esc(ini.email||'')}" ${o.lockEmail?'readonly':''}>
      ${o.lockEmail?'<div class="hint">El correo identifica al participante y no se puede cambiar. Si es otro, elimine el registro y vuelva a crearlo.</div>':''}</div>
    <div class="field"><label for="rfCargo">Cargo <span style="font-weight:400">(opcional)</span></label><select id="rfCargo" class="input">${opts(CARGOS,ini.cargo)}</select></div>
    <details class="refbox" ${refs0.length?'open':''}>
      <summary>¿Quiere sumar puntos extra? Déjenos los datos de otras personas de su institución<small>Decanos o más personal de biblioteca · hasta ${MAXREF} personas · opcional</small></summary>
      ${Array.from({length:MAXREF},(_,i)=>{const r=refs0[i]||{};return`<div class="refrow">
        <div class="field"><label for="rfRn${i}">Persona ${i+1}: nombre completo</label><input id="rfRn${i}" class="input" maxlength="100" autocomplete="off" autocapitalize="words" value="${esc(r.name||'')}"></div>
        <div class="two"><div class="field" style="margin:0"><label for="rfRe${i}">Correo</label><input id="rfRe${i}" class="input" maxlength="120" type="email" inputmode="email" autocapitalize="off" spellcheck="false" value="${esc(r.email||'')}"></div>
        <div class="field" style="margin:0"><label for="rfRc${i}">Cargo</label><select id="rfRc${i}" class="input">${opts(CARGOS_REF,r.cargo)}</select></div></div></div>`;}).join('')}
      <p class="note" style="margin:12px 0 0">Indique solo a personas que estén de acuerdo en recibir información de Sage. El bono se aplica por cada persona con nombre y correo válidos.</p>
    </details>
    ${o.withConsent?`<label class="check"><input type="checkbox" id="rfOk" ${ini.consent?'checked':''}><span>${esc(CONSENT_TEXT)}</span></label>`:''}
    <div id="rfErr" class="errbox" hidden role="alert"></div>
    <button type="button" class="btn primary big" id="rfGo">${esc(o.submitLabel)}</button>
  </div>`;
  instBox($('#rfInstHost',host),list,st,()=>{});
  $('#rfGo',host).onclick=()=>{
    const errs=[];
    const raw={
      nombres:$('#rfNom',host).value,apellidos:$('#rfApe',host).value,email:$('#rfMail',host).value,
      institution:st.name,instType:st.type,cargo:$('#rfCargo',host).value,consent:o.withConsent?$('#rfOk',host).checked:!!ini.consent,
      createdAt:ini.createdAt||Date.now(),referrals:[]
    };
    if(clip(raw.institution,200).length<3)errs.push('Indique su institución.');
    if(clip(raw.nombres,80).length<2)errs.push('Escriba sus nombres.');
    if(clip(raw.apellidos,80).length<2)errs.push('Escriba sus apellidos.');
    if(!emailRe.test(clip(raw.email,120)))errs.push('Escriba un correo electrónico válido.');
    if(o.withConsent&&!raw.consent)errs.push('Debe aceptar el tratamiento de datos para participar.');
    for(let i=0;i<MAXREF;i++){
      const n=$('#rfRn'+i,host).value,e=$('#rfRe'+i,host).value,c=$('#rfRc'+i,host).value;
      if(!clip(n,100)&&!clip(e,120))continue;
      if(clip(n,100).length<3||!emailRe.test(clip(e,120))){errs.push('Persona '+(i+1)+': escriba nombre completo y un correo válido, o deje la casilla vacía.');continue;}
      raw.referrals.push({name:n,email:e,cargo:c});
    }
    const box=$('#rfErr',host);
    if(errs.length){box.hidden=false;box.innerHTML=errs.map(x=>'• '+esc(x)).join('<br>');box.scrollIntoView({block:'nearest',behavior:'smooth'});return;}
    const p=cleanPlayer(raw);
    if(!p){box.hidden=false;box.textContent='Revise los datos e intente de nuevo.';return;}
    box.hidden=true;
    o.onSubmit(p);
  };
}

</script>

{id:'B-M6',c:'B',d:'medium',q:"Un docente quiere incluir un capítulo en Moodle o Canvas sin que el enlace se rompa. ¿Qué debe usar?",o:["El DOI o el enlace estable del capítulo","Una captura de pantalla","El PDF enviado por WhatsApp","La dirección que aparece en el buscador"],a:0,h:["Es un identificador permanente.","Empieza por «10.»"],x:"El DOI o enlace estable asegura que el LMS siempre lleve al capítulo correcto, y el estudiante entra con el acceso institucional de la biblioteca.",s:SRC_VAL},
/* ===================== LIBROS Y MODELO EBA · DIFÍCIL ===================== */
{id:'B-H1',c:'B',d:'hard',q:"¿Cuánto suele durar el período de acceso a toda la colección en un programa EBA de Sage?",o:["12 meses","3 meses","5 años","Un día"],a:0,h:["Es un año calendario.","Da tiempo a que se use durante varios semestres."],x:"Un año de acceso completo permite medir el uso a lo largo de un ciclo académico real antes de decidir qué comprar.",s:SRC_EBA},
{id:'B-H2',c:'B',d:'hard',q:"Tras la selección en EBA, ¿qué tipo de acceso queda para los títulos elegidos?",o:["Perpetuo","Por 30 días","Solo dentro del campus","Solo para docentes"],a:0,h:["No vence.","Es el valor de «ser dueño» del título."],x:"El acceso perpetuo protege la inversión: aunque el programa termine, los títulos elegidos siguen disponibles para la comunidad.",s:SRC_EBA},
{id:'B-H3',c:'B',d:'hard',q:"¿Qué otras formas de adquirir los libros de Sage existen además de EBA?",o:["Colección completa, por materias o título a título","Solo alquiler diario","Solo impresión bajo demanda","Solo donación"],a:0,h:["Hay opciones de menor a mayor compromiso.","Piense en paquetes por área temática."],x:"Además de EBA, las colecciones pueden adquirirse completas, por materia o título a título: la biblioteca elige el modelo que se ajusta a su presupuesto y a sus programas.",s:SRC_EBA},
{id:'B-H4',c:'B',d:'hard',q:"¿Cuántas colecciones por materia ofrece Sage en libros (Business, Counselling, Criminology, Education y otras)?",o:["10","3","25","60"],a:0,h:["Son menos de veinte.","Incluyen psicología y sociología."],x:"Diez materias permiten a la biblioteca comprar solo lo que sus programas necesitan, sin pagar por áreas que no usa.",s:SRC_DECK},
{id:'B-H5',c:'B',d:'hard',q:"¿Qué dato resulta más útil para decidir qué títulos conservar al final de un EBA?",o:["Vistas y descargas por título (estadísticas de uso)","El color de la portada","La longitud del título","El número de autores"],a:0,h:["Mide el interés real de la comunidad.","Se obtiene de reportes por título."],x:"Las estadísticas de uso por título convierten un presupuesto en una colección a la medida de los programas y de los investigadores.",s:SRC_EBA},
{id:'B-H6',c:'B',d:'hard',q:"¿Qué sello de referencia, fuerte en ciencia política y asuntos públicos, tiene obras alojadas en la plataforma de Sage?",o:["CQ Press","Penguin Random House","Marvel","Lonely Planet"],a:0,h:["Son dos letras y una palabra en inglés.","Es referente en política estadounidense."],x:"CQ Press complementa los títulos de Sage con obras de referencia en política y asuntos públicos.",s:SRC_EBA},

/* ===================== BUSINESS CASES · FÁCIL ===================== */
{id:'C-E1',c:'C',d:'easy',q:"¿Cuántos casos reúne aproximadamente Sage Business Cases?",o:["Más de 6.000","Unos 60","Unos 600","Más de 60.000"],a:0,h:["Es un número de cuatro cifras.","Pasa de seis mil."],x:"Más de 6.000 casos dan material para varias asignaturas sin pagar caso por caso.",s:SRC_BC},
{id:'C-E2',c:'C',d:'easy',q:"¿De cuántos países provienen los casos de la colección?",o:["Más de 120","Unos 5","Unos 20","Solo de Estados Unidos"],a:0,h:["Es una colección global.","Pasa del centenar."],x:"Casos de más de 120 países ofrecen perspectivas diversas y comparables para el aula latinoamericana.",s:SRC_BC},
{id:'C-E3',c:'C',d:'easy',q:"¿Qué material de apoyo traen muchos casos para el docente?",o:["Notas de enseñanza y preguntas de discusión","Un examen resuelto","Videos de entretenimiento","Facturas de compra"],a:0,h:["Ayudan a preparar la clase.","Algunas están reservadas a docentes verificados."],x:"Las notas de enseñanza y las preguntas de discusión reducen el tiempo de preparación y llevan el caso al aula con una guía.",s:SRC_BC},
{id:'C-E4',c:'C',d:'easy',q:"¿Cómo se lleva un caso al aula virtual (Moodle, Canvas, Brightspace)?",o:["Con un enlace estable o con código embed en HTML","Imprimiéndolo y escaneándolo","Solo por correo electrónico","No es posible"],a:0,h:["La plataforma ofrece un código para copiar.","Funciona con los LMS más usados."],x:"Cada caso ofrece enlace estable y código para incrustarlo en el LMS: el estudiante lo lee dentro del curso, con el acceso institucional.",s:SRC_BC},
{id:'C-E5',c:'C',d:'easy',q:"Si su universidad tiene la suscripción, ¿cuánto paga un estudiante por leer un caso?",o:["Nada adicional: el acceso está incluido","Un pago por cada caso","Una membresía mensual","El valor de la copia impresa"],a:0,h:["La biblioteca ya pagó el acceso.","Compárese con casos que se compran uno a uno."],x:"El acceso está incluido en la suscripción de la biblioteca: baja el costo del curso frente a casos comprados individualmente.",s:SRC_BC},
{id:'C-E6',c:'C',d:'easy',q:"¿Qué son los Express Cases?",o:["Casos breves basados en noticias de actualidad, listos para usar sin mucha preparación","Casos de 200 páginas","Exámenes finales","Videos de tres horas"],a:0,h:["«Express» sugiere rapidez.","Se basan en lo que está pasando hoy en los negocios."],x:"Los Express Cases permiten comentar en clase un hecho de actualidad de la semana, con poco tiempo de preparación.",s:SRC_BC},
/* ===================== BUSINESS CASES · MEDIA ===================== */
{id:'C-M1',c:'C',d:'medium',q:"¿Cómo accede un docente a las notas de enseñanza de los casos?",o:["Crea un perfil Sage y usa un código de verificación de instructor entregado por su biblioteca","Paga por cada nota","Las solicita a Harvard","Están abiertas sin registro"],a:0,h:["Hay un paso de verificación.","La biblioteca participa en el proceso."],x:"El perfil de instructor y el código de verificación protegen las notas y ponen a la biblioteca en el centro del servicio al docente.",s:SRC_BC},
{id:'C-M2',c:'C',d:'medium',q:"¿Qué es la serie «Sage Originals» dentro de Business Cases?",o:["Casos encargados por Sage sobre temas poco cubiertos, como sostenibilidad, impacto social y mujeres y liderazgo","Reimpresiones de casos antiguos","Libros de texto","Casos de un solo país"],a:0,h:["Son casos comisionados.","Cubren vacíos temáticos."],x:"Sage comisiona casos para llenar vacíos que la oferta tradicional deja sin cubrir, como sostenibilidad, impacto social y liderazgo femenino.",s:SRC_BC},
{id:'C-M3',c:'C',d:'medium',q:"¿Con qué otros contenidos de Sage se integran los casos en la plataforma?",o:["Libros, revistas y videos de Sage","Con ninguno","Solo con redes sociales","Solo con software contable"],a:0,h:["Es un ecosistema editorial.","Permite saltar del caso a la teoría."],x:"Los casos viven en la misma plataforma de Sage Knowledge, así que el estudiante pasa del caso al capítulo o al artículo que explica la teoría.",s:SRC_BC},
{id:'C-M4',c:'C',d:'medium',q:"¿Qué temas cubren los casos de la colección?",o:["Emprendimiento, contabilidad, gestión de la salud, liderazgo y empresa social","Solo ingeniería","Solo derecho penal","Solo cocina"],a:0,h:["Es contenido de negocios.","Incluye empresas sociales."],x:"La colección es interdisciplinaria: sirve a administración, contabilidad, salud, emprendimiento y más.",s:SRC_BC},
{id:'C-M5',c:'C',d:'medium',q:"Un docente de Marketing necesita un caso de actualidad para la clase de mañana. ¿Qué formato le conviene?",o:["Un Express Case","Un handbook de 800 páginas","Una tesis doctoral","Un libro de historia"],a:0,h:["Piense en rapidez.","Se basa en noticias recientes."],x:"Los Express Cases acercan la actualidad al aula en poco tiempo, con material listo para usar.",s:SRC_BC},
{id:'C-M6',c:'C',d:'medium',q:"¿Qué ventaja tiene incrustar el caso en el LMS en lugar de enviar un archivo?",o:["El caso se abre dentro del curso, con el acceso institucional, sin copiar ni reenviar archivos","Se vuelve de acceso libre para todo el mundo","Se traduce solo al quechua","Se imprime automáticamente"],a:0,h:["Evita circular archivos.","El acceso lo da la institución."],x:"Incrustar el caso mantiene al estudiante dentro del curso y bajo el acceso institucional: más cómodo para el estudiante y más ordenado para el docente.",s:SRC_BC},
/* ===================== BUSINESS CASES · DIFÍCIL ===================== */
{id:'C-H1',c:'C',d:'hard',q:"La estrategia «diverse-by-design» de Sage Business Cases implica…",o:["Trabajar con productores de casos de todo el mundo y comisionar casos para cubrir vacíos","Traducir solamente casos antiguos","Publicar solo casos de Estados Unidos","Eliminar casos cada año"],a:0,h:["Busca diversidad de voces y de temas.","Mezcla casos de socios y casos comisionados."],x:"La colección combina casos de productores globales con casos comisionados para ofrecer perspectivas y temas diversos.",s:SRC_BC},
{id:'C-H2',c:'C',d:'hard',q:"¿Qué puede hacer la biblioteca para impulsar el uso de los casos en las facultades?",o:["Entregar el código de instructor y mostrar a los docentes cómo incrustar casos en el LMS","Retirar la suscripción","Imprimir los 6.000 casos","Esperar a que los estudiantes los descubran solos"],a:0,h:["Es un trabajo de acompañamiento.","Empieza con los docentes."],x:"El bibliotecario es el puente: verifica instructores, enseña a incrustar casos y convierte la suscripción en uso real en el aula.",s:SRC_BC},
{id:'C-H3',c:'C',d:'hard',q:"Una universidad usa Moodle. ¿Qué hace el docente para que el caso aparezca dentro del curso?",o:["Copia el código embed (HTML) del caso y lo pega en un recurso del curso","Reescribe el caso a mano","Lo envía por WhatsApp","Descarga los 6.000 casos"],a:0,h:["La plataforma ofrece un código.","Se pega en el editor del curso."],x:"Copiar y pegar el código embed (o el enlace) integra el caso en el aula virtual en pocos pasos.",s:SRC_BC},
{id:'C-H4',c:'C',d:'hard',q:"¿Qué formatos de caso ofrece la colección?",o:["Viñetas breves y casos narrativos largos, con datos de campo y fuentes públicas","Solo infografías","Solo audio","Solo presentaciones"],a:0,h:["Hay cortos y largos.","Se escriben con investigación de campo y fuentes públicas."],x:"La variedad de formatos permite elegir desde una viñeta corta hasta un caso extenso, según el tiempo de clase y el nivel del curso.",s:SRC_BC},
{id:'C-H5',c:'C',d:'hard',q:"En un curso de 300 estudiantes, ¿qué significa que el acceso a los casos sea ilimitado?",o:["Todos pueden leer el mismo caso al mismo tiempo","Solo 30 a la vez","Hay turnos por horario","Solo se puede desde un laboratorio"],a:0,h:["No hay tope de usuarios.","Compárese con un libro impreso."],x:"Sin límite de lectores, un caso puede ser la lectura obligatoria de toda una cohorte el mismo día.",s:SRC_BC},
{id:'C-H6',c:'C',d:'hard',q:"Un estudiante lee un caso de emprendimiento y la plataforma le sugiere libros y revistas relacionados de Sage. ¿Qué logra la institución?",o:["Mayor uso de las demás suscripciones de la biblioteca","Menor uso de las demás suscripciones","Cobros adicionales","Nada: son contenidos aislados"],a:0,h:["Piense en descubrimiento cruzado.","Un recurso lleva a otro."],x:"El descubrimiento cruzado entre casos, libros y revistas eleva el retorno de toda la inversión de la biblioteca (siempre que tenga acceso a cada recurso).",s:SRC_BC},
/* ===================== AÑADIDAS DESDE LA PRESENTACIÓN (Suite CC 2026) ===================== */
{id:'J-E7',c:'J',d:'easy',q:"¿Cuántas revistas reúne la colección Premiere de Sage Journals?",o:["Más de 1.200","Unas 120","Unas 400","Más de 5.000"],a:0,h:["Es una cifra de cuatro dígitos.","Pasa de mil, pero no llega a dos mil."],x:"Premiere reúne más de 1.200 revistas multidisciplinares, todas revisadas por pares, con contenido disponible desde el año 2000 hasta hoy.",s:SRC_DECK},
{id:'J-E8',c:'J',d:'easy',q:"¿En qué año nació Sage, que desde entonces sigue siendo independiente?",o:["1965","1985","2001","2015"],a:0,h:["Hace 61 años.","La fundó Sarah Miller."],x:"Sage nació en 1965, fundada por Sarah Miller con el apoyo de George McCune, y sigue siendo independiente: puede defender investigaciones con impacto positivo en la sociedad.",s:SRC_DECK},
{id:'J-M7',c:'J',d:'medium',q:"¿Qué porcentaje del contenido de la colección Premiere está clasificado en el JCR (2024)?",o:["74%","25%","50%","99%"],a:0,h:["Casi tres de cada cuatro.","Está entre 70% y 80%."],x:"El 74% del contenido de Premiere está en el JCR: la gran mayoría de lo que la biblioteca ofrece tiene un indicador de impacto reconocido.",s:SRC_DECK},
{id:'J-M8',c:'J',d:'medium',q:"¿Cuántos artículos reúne aproximadamente Premiere, contando OnlineFirst?",o:["Más de 1.100.000","Unos 110.000","Unos 11.000","Más de 50 millones"],a:0,h:["Pasa del millón.","Y sigue creciendo."],x:"Más de 1,1 millones de artículos y creciendo: investigación reciente y archivo en una misma plataforma.",s:SRC_DECK},
{id:'J-M9',c:'J',d:'medium',q:"¿Cuántas revistas de Premiere cubren Business & Management?",o:["132","13","1.320","32"],a:0,h:["Es un número de tres cifras.","Es algo más que Education, que tiene 126."],x:"132 revistas de gestión y administración respaldan a las facultades de negocios, junto con 126 de Education y 148 de Health Sciences. Un título puede figurar en más de un área.",s:SRC_DECK},
{id:'J-M10',c:'J',d:'medium',q:"¿Qué herramienta de Sage ayuda a ver dónde se cita una investigación en documentos de política pública?",o:["Sage Policy Profiles","Sage Campus","Sage Navigator","Sage Stats"],a:0,h:["Funciona con el índice de documentos de política de Overton.","Su nombre incluye la palabra «Policy»."],x:"Sage Policy Profiles muestra a los investigadores dónde se cita su trabajo en todo el mundo, con apoyo de Overton: una forma concreta de demostrar impacto más allá de las citas académicas.",s:SRC_DECK},
{id:'J-M11',c:'J',d:'medium',q:"¿Qué lugar ocupa Sage entre las editoriales académicas más grandes del mundo?",o:["Quinta","Primera","Décima","Vigésima"],a:0,h:["Está entre las cinco primeras.","Es además la primera en métodos de investigación."],x:"Sage es la quinta editorial académica más grande del mundo y la primera en métodos de investigación.",s:SRC_DECK},
{id:'J-H7',c:'J',d:'hard',q:"¿Qué porcentaje del contenido de Premiere está clasificado en SJR (2025)?",o:["85%","40%","60%","100%"],a:0,h:["Es más que el porcentaje en JCR.","Está entre 80% y 90%."],x:"El 85% del contenido está clasificado en SJR (frente a 74% en JCR): la colección es visible en las dos grandes referencias de calidad que piden universidades y evaluadores.",s:SRC_DECK},
{id:'J-H8',c:'J',d:'hard',q:"Sage firmó la declaración DORA. ¿Qué busca, entre otras cosas?",o:["Reducir el énfasis en el Factor de Impacto y ofrecer métricas variadas, incluidas las de nivel de artículo","Aumentar el peso del Factor de Impacto en la evaluación","Limitar el número de autores por artículo","Cobrar por cada cita recibida"],a:0,h:["DORA se refiere a la evaluación de la investigación.","Propone mirar más allá de un solo indicador."],x:"DORA promueve evaluar el artículo por su contenido y no solo por la revista, con métricas variadas y prácticas de autoría responsables. Útil para comités de investigación y acreditación.",s:SRC_DECK},
{id:'J-H9',c:'J',d:'hard',q:"La colección HSS (Ciencias Sociales y Humanidades) supera las 750 revistas. ¿Qué porcentaje de su contenido está en el JCR (2024)?",o:["78%","30%","50%","99%"],a:0,h:["Es más que el 74% de Premiere.","Está entre 75% y 80%."],x:"El 78% del contenido de HSS está clasificado en el JCR, con acceso desde 1999 y más de 760.000 artículos: una opción sólida para universidades enfocadas en ciencias sociales.",s:SRC_DECK},
{id:'J-H10',c:'J',d:'hard',q:"¿Qué alianza aumentó 22% el portafolio STM de Sage, con 90 revistas en salud, ciencias de la vida y computación?",o:["IOS Press","Clarivate","Scopus","Overton"],a:0,h:["Era una editorial independiente con 35 años de historia.","Eligió a Sage para ampliar su alcance global."],x:"La alianza con IOS Press sumó diversidad temática y alcance global, y fortaleció el portafolio STM de Sage.",s:SRC_DECK},

{id:'B-E7',c:'B',d:'easy',q:"¿Qué significa que los libros de Sage no tengan DRM?",o:["Se leen sin barreras técnicas ni claves de protección","Solo se pueden leer impresos","Solo duran un año","Solo los lee un usuario a la vez"],a:0,h:["DRM significa «Digital Rights Management».","Sin DRM, menos obstáculos para el lector."],x:"Sin DRM no hace falta software especial ni claves, y el texto se puede usar con herramientas como el traductor del navegador. Menos fricción para estudiantes y docentes.",s:SRC_DECK},
{id:'B-E8',c:'B',d:'easy',q:"¿En qué área se especializa la colección de libros de Sage?",o:["Ciencias sociales","Ingeniería aeroespacial","Medicina veterinaria","Gastronomía"],a:0,h:["Psicología, educación, sociología…","Estudia a las personas y la sociedad."],x:"Sage Books & Reference es multidisciplinar con especialidad en ciencias sociales.",s:SRC_DECK},
{id:'B-M7',c:'B',d:'medium',q:"¿Desde qué año hay contenido de libros disponible en Sage Books & Reference?",o:["1976","2005","1950","2020"],a:0,h:["Tiene casi medio siglo de archivo.","Es de la década de 1970."],x:"Con contenido desde 1976, la colección combina obras clásicas y novedades en una misma plataforma.",s:SRC_DECK},
{id:'B-M8',c:'B',d:'medium',q:"¿Qué área temática tiene más libros en la colección?",o:["Educación","Psicología","Criminología","Geografía, tierra y medio ambiente"],a:0,h:["Supera los 1.700 libros.","Es de interés para las facultades de ciencias de la educación."],x:"Educación lidera con más de 1.700 libros, seguida de Sociología, Negocios y administración (cerca de 700 cada una) y Ciencia política (cerca de 650). Un libro puede estar en más de un área.",s:SRC_DECK},
{id:'B-H7',c:'B',d:'hard',q:"¿Cuántos libros de Negocios y administración hay aproximadamente en la colección?",o:["Unos 700","Unos 70","Unos 7.000","Unos 70.000"],a:0,h:["Es un número de tres cifras.","Está cerca de Sociología."],x:"Cerca de 700 libros de Negocios y administración respaldan a las facultades de gestión con teoría y práctica en la misma plataforma.",s:SRC_DECK},
{id:'B-H8',c:'B',d:'hard',q:"¿Qué caracteriza el origen de la mayoría de los libros de Sage Books & Reference?",o:["La mayoría son comisionados: Sage los encarga a especialistas","Son tesis donadas por universidades","Son traducciones automáticas","Son reimpresiones de siglos pasados"],a:0,h:["Hay un plan editorial detrás.","No son manuscritos que simplemente llegan."],x:"Que la mayoría sea comisionada indica un plan editorial: Sage encarga obras para cubrir temas y necesidades de la enseñanza y la investigación.",s:SRC_DECK}
];

</script>

}

/* ---------- Utilidades de la consola ---------- */
const fmtTime=ts=>new Date(ts).toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'});
const fmtDate=ts=>new Date(ts).toLocaleString('es-EC',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const instShort=n=>{const m=String(n||'').match(/\(([^)]+)\)\s*$/);return m?m[1]:(n||'Sin institución');};
function shortZone(z){return z.name.replace('Esquina superior','Sup.').replace('Esquina inferior','Inf.');}
function zoneById(id){return ZONES.find(z=>z.id===id);}
function zonePoints(id){return S.settings.points[S.settings.zoneDiff[id]]||0;}
function shotsOf(email){return S.shots.filter(s=>s.email===email);}
function leftOf(email){return Math.max(0,+S.settings.maxShots-shotsOf(email).length);}
function hintDeduction(n){return(n>=1?+S.settings.hint1:0)+(n>=2?+S.settings.hint2:0);}
function bonusOf(p){return Math.min(((p&&p.referrals)||[]).length,+S.settings.refMax)*(+S.settings.refPoints);}
function playerList(){return Object.values(S.players);}
function upsertPlayer(p,source){
  const prev=S.players[p.email];
  S.players[p.email]=Object.assign({},prev||{},p,{createdAt:prev?prev.createdAt:(p.createdAt||Date.now()),source:prev&&prev.source?prev.source:source});
  save();return S.players[p.email];
}
function searchPlayers(q){
  const t=norm(q).split(/\s+/).filter(Boolean);
  const all=playerList();
  if(!t.length)return all.sort((a,b)=>b.createdAt-a.createdAt).slice(0,6);
  return all.filter(p=>{const k=norm(p.name+' '+p.email+' '+p.institution);return t.every(x=>k.includes(x));}).slice(0,8);
}
function askKey(purpose){
  return new Promise(res=>openModal((m,close)=>{
    m.innerHTML=`<h3>Clave del facilitador</h3><p>${esc(purpose)}</p>
      <div class="field"><label for="k">Clave</label><input id="k" class="input" type="password" autocomplete="off"></div>
      <div class="hint bad" id="kerr"></div>
      <div class="row end"><button class="btn ghost" data-cancel>Cancelar</button><button class="btn primary" data-ok>Continuar</button></div>`;
    const inp=m.querySelector('#k');

    m.querySelector('[data-ok]').onclick=go;

}

/* ---------- Portería (SVG) ---------- */
function goalSVG({mode,selected,color,counts}){
  const X=[30,200,400,570],Y=[30,165,300];
  const max=counts?Math.max(1,...Object.values(counts)):1;
  let zones='';
  ZONES.forEach(z=>{
    const x=X[z.col],w=X[z.col+1]-x,y=Y[z.row],h=Y[z.row+1]-y,cx=x+w/2,cy=y+h/2;
    if(mode==='heat'){
      const n=counts[z.id]||0,a=n?(.18+.72*(n/max)):0;
      zones+=`<g class="zone"><rect x="${x}" y="${y}" width="${w}" height="${h}" style="fill:rgba(217,238,255,${a.toFixed(2)})"></rect>
        <text class="pts" x="${cx}" y="${cy+6}" style="${n/max>.55?'fill:var(--navy)':''}">${n}</text>
        <text class="zn" x="${cx}" y="${cy+30}" style="${n/max>.55?'fill:var(--navy)':''}">${n===1?'gol':'goles'}</text></g>`;
    }else{
      const sel=selected===z.id;
      zones+=`<g class="zone${sel?' sel':''}" data-z="${z.id}" role="button" tabindex="0" aria-label="${esc(z.name)}, ${zonePoints(z.id)} puntos" style="--zc:${color||'var(--pale)'}">
        <rect x="${x}" y="${y}" width="${w}" height="${h}"></rect>
        <text class="pts" x="${cx}" y="${cy-2}">${zonePoints(z.id)}</text>
        <text class="zn" x="${cx}" y="${cy+26}">${esc(shortZone(z))}</text>
        <text class="zd" x="${cx}" y="${cy+46}">${DIFF[S.settings.zoneDiff[z.id]]}</text></g>`;
    }
  });
  const net=`<pattern id="net${mode}" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 0L18 18M18 0L0 18" stroke="rgba(217,238,255,.16)" stroke-width="1.2"/></pattern>`;
  return `<svg class="goal ${mode==='select'?'selectable':''}" viewBox="0 0 600 322" role="img" aria-label="Portería dividida en seis zonas">
    <defs>${net}</defs>
    <line class="ground" x1="0" y1="306" x2="600" y2="306"/>
    <rect x="30" y="30" width="540" height="270" fill="url(#net${mode})"/>
    ${zones}
    <line class="divider" x1="200" y1="30" x2="200" y2="300"/><line class="divider" x1="400" y1="30" x2="400" y2="300"/>
    <line class="divider" x1="30" y1="165" x2="570" y2="165"/>
    <path class="post" d="M24 306 V24 H576 V306"/>
  </svg>`;
}

let P=null;
function resetPlay(keepPlayer){const e=(keepPlayer&&P)?P.email:null;P={email:e,query:'',cancha:null,zone:null,q:null,order:null,hints:0,chosen:null,revealAns:false,done:null};}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickQuestion(c,d,email){
  const key=c+'-'+d,pool=QB.filter(q=>q.c===c&&q.d===d);
  const seen=new Set(shotsOf(email).map(s=>s.qid));
  S.used[key]=S.used[key]||[];
  let avail=pool.filter(q=>!S.used[key].includes(q.id)&&!seen.has(q.id));
  if(!avail.length){S.used[key]=[];avail=pool.filter(q=>!seen.has(q.id));}
  if(!avail.length)avail=pool;
  const q=avail[Math.floor(Math.random()*avail.length)];
  S.used[key].push(q.id);return q;
}
function currentPoints(){const base=zonePoints(P.zone);return Math.max(0,Math.round(base*(1-hintDeduction(P.hints)/100)));}
function formReady(){return !!(P.email&&S.players[P.email]&&leftOf(P.email)>0);}
function ballsHTML(email){const max=+S.settings.maxShots,used=max-leftOf(email);return Array.from({length:max},(_,i)=>`<span class="ball ${i<used?'used':''}"></span>`).join('')+`<span>${used} de ${max} lanzamientos usados</span>`;}

function recordShot({goal,correct=false,noAnswer=false}){

    difficulty:d,basePoints:goal?zonePoints(P.zone):0,qid:goal?P.q.id:null,question:goal?P.q.q:null,
    answer:goal&&P.chosen!==null?P.q.o[P.chosen]:null,hints:goal?P.hints:0,correct:goal?correct:false,noAnswer,points};
  S.shots.push(shot);save();
  if(!goal){toast('Lanzamiento registrado');resetPlay(leftOf(pl.email)>0);renderPlay();return;}
  P.done={correct,points,noAnswer};renderPlay();
}

function openImportPass(){
  openModal((m,close)=>{
    m.innerHTML=`<h3>Importar pase</h3>
      <p class="note">Escanee el QR del celular del participante con la cámara, con un lector USB (escribe el código y pulsa Enter) o pegue el código de texto.</p>
      <div class="field"><label for="pc">Código del pase</label><input id="pc" class="input" autocomplete="off" spellcheck="false" placeholder="SGP1.…"></div>
      <div class="hint" id="pcMsg"></div>
      <div class="row end"><button class="btn ghost" data-cancel>Cerrar</button><button class="btn" id="cam">Abrir cámara</button><button class="btn primary" id="go">Importar</button></div>`;
    const inp=m.querySelector('#pc'),msg=m.querySelector('#pcMsg');
    const go=()=>{const p=decodePass(inp.value);if(!p){msg.className='hint bad';msg.textContent='Código no válido. Revise que esté completo (empieza con SGP1.).';return;}close();importPassObj(p);};
    m.querySelector('#go').onclick=go;
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
    inp.addEventListener('paste',()=>setTimeout(()=>{if(decodePass(inp.value))go();},30));
    m.querySelector('[data-cancel]').onclick=close;
    m.querySelector('#cam').onclick=()=>{close();openScanner(importPassObj);};
  });

function openScanner(onPass){
  openModal((m,close)=>{
    m.innerHTML=`<h3>Escanear pase</h3><p class="note">Apunte la cámara al QR del celular del participante.</p>
      <div class="vwrap"><video id="vid" playsinline muted></video></div><div class="hint" id="scanMsg"></div>
      <div class="row end"><button class="btn ghost" data-cancel>Cerrar</button></div>`;
    let stream=null,stop=false,timer=null;
    const msg=m.querySelector('#scanMsg'),vid=m.querySelector('#vid');
    const end=()=>{stop=true;clearTimeout(timer);if(stream)stream.getTracks().forEach(t=>t.stop());};
    m.querySelector('[data-cancel]').onclick=()=>{end();close();};
    (async()=>{
      try{
        if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('nocam');
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
        vid.srcObject=stream;await vid.play();
        const det=('BarcodeDetector' in window)?new BarcodeDetector({formats:['qr_code']}):null;
        if(!det&&typeof jsQR!=='function'){msg.className='hint bad';msg.textContent='Este navegador no puede leer QR. Use el campo de pegado o un lector USB.';return;}
        const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
        const tick=async()=>{
          if(stop)return;
          try{
            let val=null;
            if(det){const r=await det.detect(vid);if(r.length)val=r[0].rawValue;}
            else if(vid.videoWidth){cv.width=vid.videoWidth;cv.height=vid.videoHeight;cx.drawImage(vid,0,0);const id=cx.getImageData(0,0,cv.width,cv.height);const r=jsQR(id.data,id.width,id.height);if(r)val=r.data;}
            if(val){const p=decodePass(val);if(p){end();close();onPass(p);return;}msg.className='hint bad';msg.textContent='Código no reconocido. Intente de nuevo.';}
          }catch(e){}
          timer=setTimeout(tick,250);
        };
        tick();
      }catch(e){msg.className='hint bad';msg.textContent='No se pudo abrir la cámara en este equipo. Use el campo de pegado o un lector de códigos USB.';}
    })();
  });
}

const EPOCH='1970-01-01T00:00:00+00:00';
let sync={on:false,pass:null,timer:null,last:0,err:'',added:0};
function getCursor(){try{return localStorage.getItem(SYNC_KEY)||EPOCH;}catch(e){return EPOCH;}}
function setCursor(v){try{localStorage.setItem(SYNC_KEY,v);}catch(e){}}
function rowToPlayer(row){
  return cleanPlayer({nombres:row.nombres,apellidos:row.apellidos,email:row.email,institution:row.institution,instType:row.inst_type,cargo:row.cargo,consent:row.consent,referrals:row.referrals,createdAt:Date.parse(row.created_at)});
}
async function syncOnce(){
  let guard=0,news=[];
  for(;;){
    const rows=await sbRpc('mod_list',{p_pass:sync.pass,p_since:getCursor()});
    if(!Array.isArray(rows)||!rows.length)break;
    rows.forEach(row=>{const p=rowToPlayer(row);if(!p)return;const existed=!!S.players[p.email];upsertPlayer(p,'en vivo');if(!existed)news.push(p.name);});
    setCursor(rows[rows.length-1].updated_at);
    if(rows.length<500||++guard>10)break;
  }
  if(news.length){
    sync.added+=news.length;
    toast(news.length===1?'Nuevo registro: '+news[0]:news.length+' registros nuevos');
    if(currentTab==='play'&&!P.q&&!P.email)renderResults();
    if(currentTab==='people')paintPeople();
  }
}
async function syncTick(){
  clearTimeout(sync.timer);
  if(!sync.on)return;
  try{await syncOnce();sync.err='';}
  catch(e){
    sync.err=e.message||'error';
    if(sync.err==='unauthorized'){sync.on=false;sync.pass=null;try{sessionStorage.removeItem(SYNC_PASS);}catch(_){}}
  }
  sync.last=Date.now();updateSyncUI();
  if(sync.on)sync.timer=setTimeout(syncTick,sync.err?8000:4000);
}
function startSync(pass){sync.pass=pass;sync.on=true;sync.err='';try{sessionStorage.setItem(SYNC_PASS,pass);}catch(e){}syncTick();updateSyncUI();}
function stopSync(){sync.on=false;clearTimeout(sync.timer);sync.pass=null;try{sessionStorage.removeItem(SYNC_PASS);}catch(e){}updateSyncUI();}
function syncText(){
  if(!sbReady())return{cls:'bad',t:'Registro en vivo: falta configurar config.js'};
  if(!sync.on)return{cls:'',t:sync.err==='unauthorized'?'Clave del moderador incorrecta':'Registro en vivo: desconectado'};
  if(sync.err)return{cls:'bad',t:'Registro en vivo: sin conexión ('+sync.err+'), reintentando'};
  return{cls:'ok',t:'Registro en vivo · actualizado '+fmtTime(sync.last||Date.now())};
}
function updateSyncUI(){
  const st=syncText();
  const ind=$('#syncInd');
  if(ind){ind.querySelector('span').textContent=st.t;ind.querySelector('i').style.background=st.cls==='ok'?'var(--ok)':(st.cls==='bad'?'var(--bad)':'var(--muted)');}
  const box=$('#syncBox');
  if(box){
    $('#syncStatus').className='hint '+st.cls;$('#syncStatus').textContent=st.t+(sync.on?` · ${sync.added} nuevos en esta sesión`:'');
    $('#syncToggle').textContent=sync.on?'Desconectar':'Conectar';
    $('#syncNow').disabled=!sync.on;$('#syncReset').disabled=!sync.on;$('#syncWipe').disabled=!sbReady();
  }
}
function askModPass(){
  return new Promise(res=>openModal((m,close)=>{
    m.innerHTML=`<h3>Clave del moderador (Supabase)</h3><p class="note">Es la clave larga que puso en el script de Supabase, no la del facilitador. Se guarda solo mientras esta pestaña siga abierta.</p>
      <div class="field"><label for="mp">Clave</label><input id="mp" class="input" type="password" autocomplete="off"></div>
      <div class="row end"><button class="btn ghost" data-cancel>Cancelar</button><button class="btn primary" data-ok>Conectar</button></div>`;
    const inp=m.querySelector('#mp');
    const go=()=>{if(inp.value.length<8)return;close();res(inp.value);};
    m.querySelector('[data-ok]').onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
    m.querySelector('[data-cancel]').onclick=()=>{close();res(null);};
  }));
}

  return svg?`<div class="qrpanel">${svg}</div>`:'<p class="note">No se pudo generar el QR (la librería no cargó). Use el enlace para escribirlo en la etiqueta NFC.</p>';
}

/* CSV */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const delim=(first.split(';').length>first.split(',').length)?';':(first.split('\t').length>first.split(',').length?'\t':',');
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;
    else if(c===delim){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[];}
    else cell+=c;
  }
  row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);
  return rows;
}
function splitName(full){
  const t=clip(full,160).split(' ').filter(Boolean);
  if(t.length>=4)return[t.slice(0,2).join(' '),t.slice(2).join(' ')];
  if(t.length===3)return[t[0],t.slice(1).join(' ')];
  if(t.length===2)return[t[0],t[1]];
  return[t[0]||'',''];
}
function importCSVPlayers(text){
  const rows=parseCSV(text);if(rows.length<2){toast('El archivo no tiene filas de datos');return;}
  const head=rows[0].map(h=>norm(h));
  const idx=(...names)=>head.findIndex(h=>names.some(n=>h.includes(n)));
  const iNom=idx('nombres'),iApe=idx('apellidos'),iFull=head.findIndex(h=>h==='nombre'||h==='nombre completo'||h==='name'),iMail=idx('correo','email','e-mail','mail'),iInst=idx('instituc','universidad'),iCar=idx('cargo','rol','puesto'),iCons=idx('consentimiento','autoriz');
  if(iMail<0){toast('No encontré una columna de correo');return;}
  let ok=0,skip=0;
  rows.slice(1).forEach(r=>{
    let nombres=iNom>=0?r[iNom]:'',apellidos=iApe>=0?r[iApe]:'';
    if((!nombres||!apellidos)&&iFull>=0){[nombres,apellidos]=splitName(r[iFull]);}
    if((!nombres||!apellidos)&&iNom>=0&&!apellidos){[nombres,apellidos]=splitName(r[iNom]);}
    const consent=iCons>=0&&/^(si|sí|1|true|x|yes)$/i.test(norm(r[iCons]||''));
    const inst=iInst>=0?r[iInst]:'';
    const hit=parseInst(S.settings.institutions).find(i=>i.key===norm(inst));
    const p=cleanPlayer({nombres,apellidos,email:r[iMail],institution:inst,instType:hit?hit.type:'',cargo:iCar>=0?r[iCar]:'',consent,referrals:[]});
    if(p){const prev=S.players[p.email];upsertPlayer(prev?Object.assign({},p,{referrals:prev.referrals,consent:prev.consent||p.consent}):p,'csv');ok++;}else skip++;
  });
  save();paintPeople();toast(`Importados ${ok}${skip?` · omitidos ${skip} (faltan datos o el correo no es válido)`:''}`);
}

/* ================== PROYECCIÓN ================== */
function stats(){
  const by={};
  S.shots.forEach(s=>{
    const pl=S.players[s.email]||{};
    const p=by[s.email]=by[s.email]||{email:s.email,name:pl.name||s.name,institution:pl.institution||s.institution,instType:pl.instType||s.instType,points:0,correct:0,shots:0,last:0,bonus:bonusOf(pl)};
    p.points+=s.points;p.correct+=s.correct?1:0;p.shots++;p.last=Math.max(p.last,s.ts);
  });
  Object.values(by).forEach(p=>{p.total=p.points+p.bonus;});
  const players=Object.values(by).sort((a,b)=>b.total-a.total||b.correct-a.correct||a.last-b.last);
  const inst={};
  players.forEach(p=>{const k=p.institution||'Sin institución';const x=inst[k]=inst[k]||{name:k,type:p.instType,points:0,players:0};x.points+=p.total;x.players++;});
  const insts=Object.values(inst).sort((a,b)=>b.points-a.points||b.players-a.players);
  const can={J:{points:0,goals:0,correct:0,shots:0},B:{points:0,goals:0,correct:0,shots:0},C:{points:0,goals:0,correct:0,shots:0}};
  const zones={};
  S.shots.forEach(s=>{const c=can[s.cancha];if(!c)return;c.shots++;c.points+=s.points;if(s.goal){c.goals++;zones[s.zone]=(zones[s.zone]||0)+1;}if(s.correct)c.correct++;});
  const goals=S.shots.filter(s=>s.goal).length,correct=S.shots.filter(s=>s.correct).length;
  const refs=playerList().reduce((n,p)=>n+Math.min((p.referrals||[]).length,+S.settings.refMax),0);
  return{players,insts,can,zones,goals,correct,refs,total:S.shots.length};
}

function toggleProjecting(){
  const on=!document.body.classList.contains('projecting');
  document.body.classList.toggle('projecting',on);

}
