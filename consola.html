    <input class="input" id="flt" placeholder="Buscar por nombre, correo o institución" style="max-width:340px"></div>
    ${rows.length?`<div class="tablewrap"><table><thead><tr><th>Hora</th><th>Participante</th><th>Correo</th><th>Institución</th><th>Cancha</th><th>Zona</th><th>Pregunta</th><th>Pistas</th><th>Resultado</th><th>Puntos</th><th></th></tr></thead><tbody id="tb">
    ${rows.map(s=>`<tr data-s="${esc(norm(s.name+' '+s.email+' '+s.institution))}"><td>${fmtDate(s.ts)}</td><td>${esc(s.name)}</td><td>${esc(s.email)}</td><td>${esc(instShort(s.institution))}</td><td>${esc((RES[s.cancha]||{}).short||'')}</td><td>${s.goal?esc(zoneById(s.zone).name):'No fue gol'}</td><td>${esc(s.question||'—')}</td><td>${s.hints}</td><td>${s.goal?(s.correct?'Correcta':(s.noAnswer?'Sin respuesta':'Incorrecta')):'—'}</td><td><b>${s.points}</b></td><td><button class="del" data-del="${s.id}" aria-label="Borrar lanzamiento">Borrar</button></td></tr>`).join('')}
    </tbody></table></div>`:'<p class="empty">Todavía no hay lanzamientos. Registre el primero en Jugar.</p>'}
    <p class="note" style="margin-top:12px">Borrar un lanzamiento le devuelve ese intento al participante. Requiere la clave.</p></div>`;
  const f=$('#flt');if(f)f.addEventListener('input',()=>{const t=norm(f.value);$$('tbody tr',v).forEach(r=>r.hidden=!r.dataset.s.includes(t));});
  $$('[data-del]',v).forEach(b=>b.onclick=async()=>{
    if(!(await askKey('Escriba la clave para borrar este lanzamiento.')))return;
    S.shots=S.shots.filter(s=>s.id!==b.dataset.del);save();renderLog();toast('Lanzamiento borrado');
  });
}

/* ================== PREGUNTAS (banco, protegido) ================== */
let bankUnlocked=false,bankFilter={c:'all',d:'all'};
function renderBank(){
  const v=$('#view-bank');
  if(!bankUnlocked){
    v.innerHTML=`<div class="panel" style="max-width:520px"><h3>Banco de preguntas protegido</h3><p>Muestra preguntas, respuestas y fuentes para revisarlas antes del evento. Se abre con la clave del facilitador.</p><button class="btn primary" id="unlockB">Desbloquear</button></div>`;
    $('#unlockB').onclick=async()=>{if(await askKey('Escriba la clave para ver el banco de preguntas.')){bankUnlocked=true;renderBank();}};
    return;
  }
  const list=QB.filter(q=>(bankFilter.c==='all'||q.c===bankFilter.c)&&(bankFilter.d==='all'||q.d===bankFilter.d));
  const opt=(o,sel)=>o.map(([k,t])=>`<option value="${k}" ${k===sel?'selected':''}>${esc(t)}</option>`).join('');
  v.innerHTML=`<div class="panel">
    <div class="row" style="justify-content:space-between;margin-bottom:6px"><h3 style="margin:0">Banco de preguntas (${list.length} de ${QB.length})</h3>
      <div class="row"><select class="input" id="bC" style="width:auto">${opt([['all','Todos los recursos'],['J','Sage Journals'],['B','Libros · EBA'],['C','Business Cases']],bankFilter.c)}</select>
      <select class="input" id="bD" style="width:auto">${opt([['all','Todas las dificultades'],['easy','Fácil'],['medium','Media'],['hard','Difícil']],bankFilter.d)}</select>
      <button class="btn sm" id="bExp">Exportar (.csv)</button><button class="btn sm ghost" id="bLock">Cerrar</button></div></div>
    <p class="note">Cada pregunta indica su fuente. Las marcadas «validar» dependen del material de Sage del evento; confirme esas cifras antes de usarlas.</p>
    ${list.map(q=>`<div class="bankq"><h4><span class="chip" style="border-color:${RES[q.c].color}">${esc(RES[q.c].short)}</span> <span class="chip">${DIFF[q.d]}</span> ${esc(q.q)}</h4>
      <ol type="A">${q.o.map((o,i)=>`<li class="${i===q.a?'right':''}">${esc(o)}</li>`).join('')}</ol>
      <div class="meta"><b>Pistas:</b> ${esc(q.h[0])} · ${esc(q.h[1])}<br><b>Explicación:</b> ${esc(q.x)}<br><b>Fuente:</b> ${esc(q.s)}</div></div>`).join('')}
  </div>`;
  $('#bC').onchange=e=>{bankFilter.c=e.target.value;renderBank();};
  $('#bD').onchange=e=>{bankFilter.d=e.target.value;renderBank();};
  $('#bLock').onclick=()=>{bankUnlocked=false;renderBank();};
  $('#bExp').onclick=()=>{
    const head=['id','recurso','dificultad','pregunta','opcion_A','opcion_B','opcion_C','opcion_D','correcta','pista_1','pista_2','explicacion','fuente'];
    const lines=[head.join(',')].concat(QB.map(q=>[q.id,RES[q.c].name,DIFF[q.d],q.q,...q.o,'ABCD'[q.a],q.h[0],q.h[1],q.x,q.s].map(csvCell).join(',')));
    offerFile('banco-preguntas-sage.csv','\ufeff'+lines.join('\n'));
  };
}

/* ================== DATOS ================== */
let DL=null;
(async()=>{try{if(window.claude&&typeof window.claude.use==='function'){DL=await window.claude.use('downloads');}}catch(e){DL=null;} if(currentTab==='data')renderData();})();
function stamp(){const d=new Date();return d.toISOString().slice(0,16).replace(/[-:T]/g,'');}
async function offerFile(filename,text){
  if(DL){
    try{await DL.save({filename,data:text});toast('Archivo listo');return;}
    catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('Espere un momento y vuelva a intentarlo');return;}}
  }
  openModal((m,close)=>{
    m.innerHTML=`<h3>Copie este contenido</h3><p>Este navegador no permite descargar el archivo directamente. Copie el texto y guárdelo como <b>${esc(filename)}</b>.</p>
    <textarea class="input" rows="10" readonly>${esc(text)}</textarea>
    <div class="row end"><button class="btn ghost" data-cancel>Cerrar</button><button class="btn primary" data-ok>Copiar</button></div>`;
    const ta=m.querySelector('textarea');
    m.querySelector('[data-cancel]').onclick=close;
    m.querySelector('[data-ok]').onclick=async()=>{ta.select();try{await navigator.clipboard.writeText(text);toast('Copiado');}catch(e){try{document.execCommand('copy');toast('Copiado');}catch(_){}}};
  });
}
function csvCell(v){v=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return /[",\n;\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportJSON(){offerFile(`penaltis-sage-progreso-${stamp()}.json`,JSON.stringify(Object.assign({exportedAt:new Date().toISOString(),app:'penaltis-sage-bibliotecas'},S),null,1));}
function exportShotsCSV(){
  const head=['fecha','nombre','correo','institucion','tipo_institucion','recurso','gol','zona','dificultad','pregunta','respuesta_dada','pistas','correcta','puntos'];
  const lines=[head.join(',')].concat(S.shots.map(s=>[new Date(s.ts).toLocaleString('es-EC'),s.name,s.email,s.institution,s.instType,(RES[s.cancha]||{}).name,s.goal?'sí':'no',s.goal?zoneById(s.zone).name:'',s.difficulty?DIFF[s.difficulty]:'',s.question||'',s.answer||'',s.hints,s.correct?'sí':'no',s.points].map(csvCell).join(',')));
  offerFile(`penaltis-sage-resultados-${stamp()}.csv`,'\ufeff'+lines.join('\n'));
}
function exportPlayersCSV(){
  const head=['fecha_registro','nombres','apellidos','correo','institucion','tipo_institucion','cargo','consentimiento','referido1_nombre','referido1_correo','referido1_cargo','referido2_nombre','referido2_correo','referido2_cargo','lanzamientos','puntos_juego','puntos_bono_referidos','puntos_total'];
  const lines=[head.join(',')].concat(playerList().map(p=>{
    const sh=shotsOf(p.email),pts=sh.reduce((n,s)=>n+s.points,0),r=p.referrals||[],b=sh.length?bonusOf(p):0;
    return[new Date(p.createdAt).toLocaleString('es-EC'),p.nombres,p.apellidos,p.email,p.institution,p.instType,p.cargo,p.consent?'sí':'no',
      (r[0]||{}).name,(r[0]||{}).email,(r[0]||{}).cargo,(r[1]||{}).name,(r[1]||{}).email,(r[1]||{}).cargo,sh.length,pts,b,pts+b].map(csvCell).join(',');}));
  offerFile(`penaltis-sage-participantes-${stamp()}.csv`,'\ufeff'+lines.join('\n'));
}
function exportRefsCSV(){
  const head=['referente_nombre','referente_correo','institucion','referido_nombre','referido_correo','referido_cargo'];
  const rows=[];playerList().forEach(p=>(p.referrals||[]).forEach(r=>rows.push([p.name,p.email,p.institution,r.name,r.email,r.cargo].map(csvCell).join(','))));
  offerFile(`penaltis-sage-referidos-${stamp()}.csv`,'\ufeff'+[head.join(',')].concat(rows).join('\n'));
}
async function importText(text){
  let d;try{d=JSON.parse(text);}catch(e){toast('El archivo no es un JSON válido');return;}
  if(!d||!Array.isArray(d.shots)||typeof d.players!=='object'){toast('El archivo no es un progreso de este juego');return;}
  const ok=await confirmBox('Cargar progreso',`Se reemplaza el progreso actual (${S.shots.length} lanzamientos) por el del archivo (${d.shots.length} lanzamientos, ${Object.keys(d.players||{}).length} participantes).`,'Cargar y seguir jugando');
  if(!ok)return;
  S=normalize(d);save();resetPlay(false);applyEvent();toast('Progreso cargado');renderData();
}
function renderData(){
  const v=$('#view-data');
  const np=playerList().length,nr=playerList().reduce((n,p)=>n+(p.referrals||[]).length,0);
  v.innerHTML=`<div class="grid2">
    <div class="panel"><h3>Guardar progreso</h3><p>Descargue una copia completa: participantes, lanzamientos, preguntas usadas y ajustes. Hágalo cada cierto tiempo durante el evento.</p>
      <button class="btn primary" id="exJ">Exportar progreso (.json)</button></div>
    <div class="panel"><h3>Cargar progreso</h3><p>Si se cerró la pestaña o cambia de equipo, cargue el último archivo exportado y siga donde quedó.</p>
      <div class="row"><button class="btn" id="imJ">Elegir archivo .json</button><button class="btn ghost" id="imP">Pegar contenido</button></div>
      <input type="file" id="file" accept=".json,application/json" hidden></div>
    <div class="panel"><h3>Participantes y referidos</h3><p>Una fila por participante, con sus datos de contacto, el consentimiento y los colegas invitados. Se abre en Excel.</p>
      <div class="row"><button class="btn" id="exP" ${np?'':'disabled'}>Participantes (.csv)</button><button class="btn" id="exR" ${nr?'':'disabled'}>Referidos (.csv)</button></div></div>
    <div class="panel"><h3>Resultados del juego</h3><p>Una fila por lanzamiento con participante, institución, recurso, pregunta y puntos.</p>
      <button class="btn" id="exC" ${S.shots.length?'':'disabled'}>Resultados (.csv)</button></div>
    <div class="panel"><h3>Empezar un evento nuevo</h3><p>Borra participantes y lanzamientos. Conserva los ajustes. Exporte antes de hacerlo.</p>
      <button class="btn danger" id="wipe" ${S.shots.length||np?'':'disabled'}>Borrar todo</button></div>
  </div>
  <p class="note" style="margin-top:16px">${storageOk?'El progreso se guarda solo en este navegador después de cada cambio.':'El guardado automático no está disponible aquí: exporte el progreso con frecuencia.'} Hay ${np} participantes y ${S.shots.length} lanzamientos registrados. Los datos personales de los participantes viven en este navegador y en los archivos que usted exporte.</p>`;
  $('#exJ').onclick=exportJSON;$('#exC').onclick=exportShotsCSV;$('#exP').onclick=exportPlayersCSV;$('#exR').onclick=exportRefsCSV;
  $('#imJ').onclick=()=>$('#file').click();
  $('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importText(r.result);r.readAsText(f);e.target.value='';};
  $('#imP').onclick=()=>openModal((m,close)=>{
    m.innerHTML=`<h3>Pegar progreso</h3><p>Pegue el contenido completo del archivo .json exportado.</p><textarea class="input" rows="9"></textarea>
    <div class="row end"><button class="btn ghost" data-cancel>Cancelar</button><button class="btn primary" data-ok>Cargar</button></div>`;
    m.querySelector('[data-cancel]').onclick=close;
    m.querySelector('[data-ok]').onclick=()=>{const t=m.querySelector('textarea').value;close();importText(t);};
  });
  $('#wipe').onclick=async()=>{
    if(!(await askKey('Escriba la clave para borrar todos los datos del evento.')))return;
    if(!(await confirmBox('Borrar todo','Se eliminan todos los participantes y lanzamientos de este navegador. No se puede deshacer.','Borrar todo',true)))return;
    S.players={};S.shots=[];S.used={};save();resetPlay(false);renderData();toast('Datos borrados');
  };
}

/* ================== AJUSTES ================== */
let settingsUnlocked=false;
function renderSettings(){
  const v=$('#view-settings');
  if(!settingsUnlocked){
    v.innerHTML=`<div class="panel" style="max-width:520px"><h3>Ajustes protegidos</h3><p>Los ajustes cambian puntos, clave, bono por referidos e instituciones. Se abren con la clave del facilitador.</p><button class="btn primary" id="unlock">Desbloquear ajustes</button></div>`;
    $('#unlock').onclick=async()=>{if(await askKey('Escriba la clave para editar los ajustes.')){settingsUnlocked=true;renderSettings();}};
    return;
  }
  const s=S.settings;
  const dsel=id=>`<select class="input" data-zd="${id}">${Object.keys(DIFF).map(k=>`<option value="${k}" ${s.zoneDiff[id]===k?'selected':''}>${DIFF[k]}</option>`).join('')}</select>`;
  v.innerHTML=`<div class="grid2">
    <div class="panel"><h3>Evento</h3>
      <div class="field"><label for="sEv">Nombre en pantalla</label><input id="sEv" class="input" value="${esc(s.event)}"></div>
      <div class="field"><label for="sKey">Clave del facilitador</label><input id="sKey" class="input" value="${esc(s.key)}"></div>
      <div class="field"><label for="sMax">Lanzamientos por persona</label><input id="sMax" class="input" type="number" min="1" max="10" value="${s.maxShots}"></div>
    </div>
    <div class="panel"><h3>Puntos, pistas y referidos</h3>
      <div class="field"><label for="pE">Pregunta fácil</label><input id="pE" class="input" type="number" min="0" value="${s.points.easy}"></div>
      <div class="field"><label for="pM">Pregunta media</label><input id="pM" class="input" type="number" min="0" value="${s.points.medium}"></div>
      <div class="field"><label for="pH">Pregunta difícil</label><input id="pH" class="input" type="number" min="0" value="${s.points.hard}"></div>
      <div class="row"><div class="field" style="flex:1"><label for="h1p">Pista 1 resta (%)</label><input id="h1p" class="input" type="number" min="0" max="100" value="${s.hint1}"></div>
      <div class="field" style="flex:1"><label for="h2p">Pista 2 resta (%)</label><input id="h2p" class="input" type="number" min="0" max="100" value="${s.hint2}"></div></div>
      <div class="row"><div class="field" style="flex:1"><label for="rP">Puntos por persona adicional</label><input id="rP" class="input" type="number" min="0" value="${s.refPoints}"></div>
      <div class="field" style="flex:1"><label for="rM">Máximo de personas que suman</label><input id="rM" class="input" type="number" min="0" max="${MAXREF}" value="${s.refMax}"></div></div>
      <p class="note">El bono entra al marcador cuando el participante ha hecho al menos un lanzamiento.</p>
    </div>
    <div class="panel"><h3>Dificultad por zona de la portería</h3>
      ${ZONES.map(z=>`<div class="field"><label>${esc(z.name)}</label>${dsel(z.id)}</div>`).join('')}
    </div>
    <div class="panel"><h3>Instituciones</h3><p>Una por línea, en formato <b>Nombre (SIGLAS) | Pública</b>. El tipo puede ser Pública, Privada u Otra. Esta lista alimenta «Registrar en sitio» y la importación de .csv. La página de registro pública lleva su propia copia.</p>
      <textarea id="sInst" class="input" rows="14">${esc(s.institutions.join('\n'))}</textarea></div>
  </div>
  <div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn ghost" id="lock">Cerrar ajustes</button><button class="btn primary" id="saveS">Guardar ajustes</button></div>`;
  $('#lock').onclick=()=>{settingsUnlocked=false;renderSettings();};
  $('#saveS').onclick=()=>{
    const num=(id,min,max,def)=>{const n=parseInt($(id).value,10);return isNaN(n)?def:Math.min(max,Math.max(min,n));};
    const key=$('#sKey').value.trim();if(!key){toast('La clave no puede quedar vacía');return;}
    s.event=$('#sEv').value.trim()||'Tanda de penaltis Sage';s.key=key;
    s.maxShots=num('#sMax',1,10,3);
    s.points={easy:num('#pE',0,9999,100),medium:num('#pM',0,9999,200),hard:num('#pH',0,9999,300)};
    s.hint1=num('#h1p',0,100,25);s.hint2=num('#h2p',0,100,25);
    s.refPoints=num('#rP',0,9999,50);s.refMax=num('#rM',0,MAXREF,MAXREF);
    $$('[data-zd]',v).forEach(x=>s.zoneDiff[x.dataset.zd]=x.value);
    const il=$('#sInst').value.split('\n').map(x=>x.trim()).filter(Boolean);if(il.length)s.institutions=il;
    save();applyEvent();toast('Ajustes guardados');
  };
}

/* ================== Navegación ================== */
function applyEvent(){$('#evTitle').textContent='Tanda de penaltis';document.title=S.settings.event;}
function renderCurrent(){({play:renderPlay,people:renderPeople,proj:renderProj,log:renderLog,bank:renderBank,data:renderData,settings:renderSettings})[currentTab]();}
function setTab(name){
  currentTab=name;
  $$('.tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab===name));
  ['play','people','proj','log','bank','data','settings'].forEach(k=>$('#view-'+k).hidden=k!==name);
  if(name!=='settings')settingsUnlocked=false;
  if(name!=='bank')bankUnlocked=false;
  renderCurrent();
}
$$('.tab').forEach(t=>t.onclick=()=>setTab(t.dataset.tab));
$('#view-play').addEventListener('click',onPlayClick);
$('#hLogo').src=SAGE_WHITE;
$('#syncInd').onclick=()=>setTab('people');
applyEvent();renderPlay();save();updateSyncUI();
(function resume(){try{const pw=sessionStorage.getItem(SYNC_PASS);if(pw&&sbReady())startSync(pw);}catch(e){}})();

</script>
</body>
</html>
