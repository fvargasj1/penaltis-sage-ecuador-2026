:root{
  /* Paleta Sage (Brand Guidelines 2026) + color propio por recurso */
  --navy:#001A69; --navy-deep:#00124A; --surface:#0A2C74; --surface-2:#12398A;
  --coral:#F86A78;  /* Sage Journals */
  --peri:#86B8FF;   /* Sage Books & Reference */
  --orange:#FFA55F; /* Sage Business */
  --teal:#08C9C4;   /* Sage Highlight Teal */
  --blue:#348AF7;   /* Sage Highlight Blue */
  --pale:#D9EEFF; --white:#FFFFFF; --muted:#9FB8DE;
  --seam:rgba(217,238,255,.16); --seam-2:rgba(217,238,255,.30);
  --ok:#3DDC97; --bad:#FF8A8A;
  --peak:'Sage Peak','Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --sans:'Open Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --navy:#001A69; --pale:#D9EEFF; } }
:root[data-theme="dark"]{ --navy:#001A69; --pale:#D9EEFF; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--sans);color:var(--pale);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(120% 80% at 8% -10%, rgba(52,138,247,.18), transparent 55%),
    radial-gradient(110% 80% at 100% 0%, rgba(8,201,196,.12), transparent 50%),
    radial-gradient(90% 60% at 50% 110%, rgba(255,165,95,.07), transparent 60%),
    var(--navy);
  background-attachment:fixed;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pale);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1320px;margin:0 auto;padding:18px clamp(14px,3vw,28px) 40px}

/* ---------- Controles comunes ---------- */
.panel{background:var(--surface);border:1px solid var(--seam);border-radius:16px;padding:20px}
.step{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.step b{font-size:13px;font-weight:800;color:var(--navy);background:var(--pale);border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center;flex:none}
.step h2{margin:0;font-size:17px;font-weight:700;color:var(--white)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}
.input,select.input,textarea.input{width:100%;background:var(--navy-deep);border:1px solid var(--seam-2);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--white)}
select.input option,select.input optgroup{background:#0A2C74;color:#fff}
.input:focus{border-color:var(--pale);outline:none}
.input.err{border-color:var(--bad)}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:16px;line-height:1.4}
.hint.bad{color:var(--bad)} .hint.ok{color:var(--ok)}
.btn{border:1px solid var(--seam-2);background:var(--surface-2);color:var(--white);border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--pale)}
.btn.primary{background:var(--pale);color:var(--navy);border-color:var(--pale)}
.btn.primary:hover{background:var(--white)}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(255,138,138,.5);color:var(--bad);background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.big{padding:15px 22px;font-size:17px;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--seam-2);color:var(--pale);white-space:nowrap}
.rcard{background:var(--c);border-radius:12px;padding:14px 16px;color:#001A69}
.rcard img{display:block;width:min(170px,100%);height:auto}
.rcard small{display:block;margin-top:8px;font-size:13px;font-weight:700;color:#001A69}
.sagelogo{height:34px;width:auto;display:block}
.ribbon{display:inline-block;background:var(--teal);color:#001A69;padding:.02em .35em .1em;border-radius:3px 3px 3px 3px/9px 9px 4px 4px;transform:rotate(-1.2deg);margin-left:.1em}

/* ---------- Combo de instituciones ---------- */
.combo-list{list-style:none;margin:6px 0 0;padding:0;border:1px solid var(--seam-2);border-radius:10px;overflow:hidden;background:var(--navy-deep)}
.combo-list li+li{border-top:1px solid var(--seam)}
.combo-list button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;font-size:15px;color:var(--white);line-height:1.3}
.combo-list button:hover,.combo-list button:focus-visible{background:var(--surface-2)}
.combo-list .other{color:var(--pale);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
details.refbox{border:1px dashed var(--seam-2);border-radius:12px;padding:12px 14px;margin:6px 0 16px;background:rgba(0,18,74,.45)}
details.refbox summary{cursor:pointer;font-weight:700;color:var(--white);font-size:15px;line-height:1.35}
details.refbox summary small{display:block;font-weight:600;color:var(--muted);font-size:12.5px;margin-top:2px}
.refrow{border-top:1px solid var(--seam);padding-top:12px;margin-top:12px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;font-weight:400;line-height:1.45;color:var(--pale);margin:4px 0 14px}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:#08C9C4}
.errbox{border:1px solid var(--bad);background:rgba(255,138,138,.1);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--white);margin-bottom:12px}

/* ---------- Modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,10,40,.72);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--seam-2);border-radius:16px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}
.modal.wide{width:min(720px,100%)}
.modal h3{margin:0 0 10px;font-size:19px;color:var(--white)}
.modal p{margin:0 0 14px;font-size:15px;line-height:1.5}
.modal .row.end{justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pale);color:var(--navy);font-weight:700;padding:10px 18px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw;text-align:center}
.vwrap{border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-bottom:10px}
.vwrap video{width:100%;height:100%;object-fit:cover;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* ---------- Página de registro (celular) ---------- */
.reg{max-width:580px;margin:0 auto;padding:20px 16px 48px}
.reg-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.reg-top .rule{width:1px;height:34px;background:var(--seam-2)}
.reg-top h1{margin:0;font-size:18px;font-weight:800;color:var(--white);line-height:1.2}
.reg-top p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.hero{margin-bottom:16px}
.hero h2{margin:0 0 8px;font-size:clamp(24px,6vw,32px);line-height:1.15;color:var(--white);font-weight:800;letter-spacing:-.01em}
.hero p{margin:0 0 14px;font-size:15px;line-height:1.5}
.hero .rm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.hero .rm{grid-template-columns:1fr}}

.pass{text-align:center}
.pass h2{margin:0 0 6px;font-size:24px;color:var(--white)}
.pass .qrbox{background:#fff;border-radius:16px;padding:10px;width:min(320px,86vw);margin:16px auto}
.pass .qrbox svg{display:block;width:100%;height:auto}
.pass .meta{font-size:14px;line-height:1.5;color:var(--pale);margin:6px 0 16px}
.pass .meta strong{color:var(--white);font-size:17px;display:block}
.pass textarea{font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.steps{display:grid;gap:8px;text-align:left;margin:16px 0;padding:14px 16px;border-radius:12px;background:var(--navy-deep);border:1px solid var(--seam)}
.steps div{display:flex;gap:10px;font-size:14px;line-height:1.4}
.steps b{flex:none;width:22px;height:22px;border-radius:50%;background:var(--pale);color:var(--navy);display:grid;place-items:center;font-size:12px}

<script>
'use strict';
const BUILD='registro';

/* ================== Configuración (config.js) y Supabase ================== */
const CFG=(typeof window!=='undefined'&&window.SAGE_CONFIG)||{};
function sbReady(){
  const u=String(CFG.supabaseUrl||''),k=String(CFG.supabaseKey||'');
  return /^https?:\/\/[^\s]+$/.test(u)&&!/X{4,}/i.test(u)&&k.length>20&&!/X{4,}/.test(k);
}
async function sbRpc(fn,body,timeoutMs){
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),timeoutMs||12000);
  const headers={'Content-Type':'application/json','apikey':CFG.supabaseKey};
  if(String(CFG.supabaseKey).startsWith('eyJ'))headers['Authorization']='Bearer '+CFG.supabaseKey;
  try{
    const r=await fetch(String(CFG.supabaseUrl).replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers,body:JSON.stringify(body),signal:ctl.signal});
    const txt=await r.text();let data=null;try{data=txt?JSON.parse(txt):null;}catch(e){}
    if(!r.ok){const e=new Error((data&&(data.message||data.error||data.hint))||('http_'+r.status));e.status=r.status;throw e;}
    return data;
  }catch(e){if(e&&e.name==='AbortError'){const x=new Error('timeout');x.status=0;throw x;}throw e;}
  finally{clearTimeout(t);}
}

/* ================== Utilidades ================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const emailRe=/^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]{2,}$/;
function clip(v,n){return String(v==null?'':v).replace(/[\u0000-\u001f]/g,' ').replace(/\s+/g,' ').trim().slice(0,n);}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function openModal(build,wide){
  const scrim=document.createElement('div');scrim.className='scrim';
  const m=document.createElement('div');m.className='modal'+(wide?' wide':'');m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');
  scrim.appendChild(m);document.body.appendChild(scrim);
  const close=()=>scrim.remove();
  build(m,close);
  const f=m.querySelector('input,textarea,button.primary,button');if(f)setTimeout(()=>f.focus(),20);
  scrim.addEventListener('keydown',e=>{if(e.key==='Escape'){const c=m.querySelector('[data-cancel]');if(c)c.click();else close();}});
  return close;
}
function confirmBox(title,msg,okLabel='Aceptar',danger=false){
  return new Promise(res=>openModal((m,close)=>{
    m.innerHTML=`<h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="row end"><button class="btn ghost" data-cancel>Cancelar</button><button class="btn ${danger?'danger':'primary'}" data-ok>${esc(okLabel)}</button></div>`;
    m.querySelector('[data-cancel]').onclick=()=>{close();res(false);};
    m.querySelector('[data-ok]').onclick=()=>{close();res(true);};
  }));
}

function parseInst(lines){
  return (lines||[]).map(l=>{const i=String(l).lastIndexOf('|');const n=(i<0?l:l.slice(0,i)).trim();const t=i<0?'':l.slice(i+1).trim();return n?{name:n,type:t,key:norm(n)}:null;}).filter(Boolean);
}

/* ================== Jugador y pase ================== */
function cleanPlayer(p){
  const email=clip(p.email,120).toLowerCase();
  if(!emailRe.test(email))return null;
  const nombres=clip(p.nombres,80),apellidos=clip(p.apellidos,80);
  if(nombres.length<2||apellidos.length<2)return null;
  const refs=[];
  (p.referrals||[]).forEach(r=>{
    if(refs.length>=MAXREF||!r)return;
    const n=clip(r.name,100),e=clip(r.email,120).toLowerCase();
    if(n.length>=3&&emailRe.test(e)&&e!==email&&!refs.some(x=>x.email===e))refs.push({name:n,email:e,cargo:clip(r.cargo,60)});
  });
  return{id:email,email,nombres,apellidos,name:nombres+' '+apellidos,institution:clip(p.institution,140),instType:clip(p.instType,20),cargo:clip(p.cargo,60),referrals:refs,consent:!!p.consent,createdAt:+p.createdAt||Date.now()};
}
function b64uEnc(str){const b=new TextEncoder().encode(str);let s='';b.forEach(x=>{s+=String.fromCharCode(x);});return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64uDec(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t);const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return new TextDecoder().decode(b);}
function encodePass(p){
  const arr=[1,p.nombres,p.apellidos,p.email,p.institution,p.instType||'',p.cargo||'',(p.referrals||[]).map(r=>[r.name,r.email,r.cargo||'']),p.consent?1:0,p.createdAt||Date.now()];
  return 'SGP1.'+b64uEnc(JSON.stringify(arr));
}
function decodePass(text){
  const m=String(text||'').match(/SGP1\.[A-Za-z0-9_-]+/);if(!m)return null;
  try{
    const arr=JSON.parse(b64uDec(m[0].slice(5)));
    if(!Array.isArray(arr)||arr[0]!==1)return null;
    const refs=Array.isArray(arr[7])?arr[7].map(r=>({name:r[0],email:r[1],cargo:r[2]})):[];
    return cleanPlayer({nombres:arr[1],apellidos:arr[2],email:arr[3],institution:arr[4],instType:arr[5],cargo:arr[6],referrals:refs,consent:!!arr[8],createdAt:arr[9]});
  }catch(e){return null;}
}
/* QR en SVG (negro sobre blanco, con margen). Devuelve null si la librería no cargó. */
function qrSVG(text){
  if(typeof qrcode!=='function')return null;
  try{
    const q=qrcode(0,'L');q.addData(String(text));q.make();
    const n=q.getModuleCount(),m=4;let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+(c+m)+' '+(r+m)+'h1v1h-1z';
    const sz=n+2*m;
    return `<svg viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges" role="img" aria-label="Código QR"><rect width="${sz}" height="${sz}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }catch(e){return null;}
}

    <ul class="combo-list" id="rfInstList" role="listbox" hidden></ul>
    <div id="rfInstExtra" hidden style="margin-top:10px"><label for="rfInstType">Tipo de institución</label>
      <select class="input" id="rfInstType"><option value="">Seleccione…</option><option>Pública</option><option>Privada</option><option>Otra</option></select></div>
    <div class="hint" id="rfInstHint"></div>`;
  const inp=$('#rfInst',host),ul=$('#rfInstList',host),extra=$('#rfInstExtra',host),sel=$('#rfInstType',host),hint=$('#rfInstHint',host);
  const exact=()=>list.find(i=>i.key===norm(st.name));
  function sync(){
    const hit=exact();
    if(hit){st.type=hit.type;extra.hidden=true;hint.className='hint ok';hint.textContent='✓ '+(hit.type||'Institución')+' · seleccionada de la lista';}
    else if(clip(st.name,200).length>=3){extra.hidden=false;sel.value=st.type||'';hint.className='hint';hint.textContent='Institución fuera de la lista: se registrará tal como la escribió.';}
    else{extra.hidden=true;hint.className='hint';hint.textContent='';}
    onChange(st);
  }
  function showList(){
    const q=norm(inp.value);
    if(!q){ul.hidden=true;inp.setAttribute('aria-expanded','false');return;}
    const toks=q.split(/\s+/);
    let hits=list.filter(i=>toks.every(t=>i.key.includes(t)));
    hits.sort((a,b)=>(b.key.startsWith(q)-a.key.startsWith(q))||a.name.localeCompare(b.name,'es'));
    hits=hits.slice(0,8);
    ul.innerHTML=hits.map((h,i)=>`<li role="option"><button type="button" data-i="${i}"><span>${esc(h.name)}</span>${h.type?`<span class="chip">${esc(h.type)}</span>`:''}</button></li>`).join('')+
      (clip(inp.value,200).length>=3?`<li role="option"><button type="button" class="other" data-other="1">Mi institución no aparece: usar «${esc(clip(inp.value,60))}»</button></li>`:'');
    ul.hidden=!ul.innerHTML;inp.setAttribute('aria-expanded',String(!ul.hidden));
    ul._hits=hits;
  }
  inp.addEventListener('input',()=>{st.name=inp.value;st.type='';showList();sync();});
  inp.addEventListener('keydown',e=>{if(e.key==='Escape'){ul.hidden=true;}});
  inp.addEventListener('blur',()=>setTimeout(()=>{ul.hidden=true;},180));
  ul.addEventListener('mousedown',e=>e.preventDefault());
  ul.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.other){ul.hidden=true;sync();sel.focus();return;}
    const h=ul._hits[+b.dataset.i];if(!h)return;
    st.name=h.name;st.type=h.type;inp.value=h.name;ul.hidden=true;sync();
  });
  sel.addEventListener('change',()=>{st.type=sel.value;onChange(st);});
  sync();
}

/* ================== Formulario de registro (celular y consola) ================== */
function regForm(host,opt){
  const o=Object.assign({initial:null,lockEmail:false,submitLabel:'Continuar',instList:DEFAULT_INST,withConsent:true,onSubmit:()=>{}},opt||{});
  const ini=o.initial||{};
  const list=parseInst(o.instList);
  const st={name:ini.institution||'',type:ini.instType||''};
  const refs0=(ini.referrals||[]);
  const opts=(arr,sel)=>'<option value="">Seleccione…</option>'+arr.map(c=>`<option ${c===sel?'selected':''}>${esc(c)}</option>`).join('');
  host.innerHTML=`
  <div class="rform">
    <div class="field"><label for="rfInst">Institución</label><div id="rfInstHost"></div></div>
    <div class="two">
      <div class="field"><label for="rfNom">Nombres</label><input id="rfNom" class="input" maxlength="80" autocomplete="given-name" autocapitalize="words" value="${esc(ini.nombres||'')}"></div>
      <div class="field"><label for="rfApe">Apellidos</label><input id="rfApe" class="input" maxlength="80" autocomplete="family-name" autocapitalize="words" value="${esc(ini.apellidos||'')}"></div>
    </div>
    <div class="field"><label for="rfMail">Correo electrónico</label><input id="rfMail" class="input" maxlength="120" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="nombre@institucion.edu.ec" value="${esc(ini.email||'')}" ${o.lockEmail?'readonly':''}>
      ${o.lockEmail?'<div class="hint">El correo identifica al participante y no se puede cambiar. Si es otro, elimine el registro y vuelva a crearlo.</div>':''}</div>
    <div class="field"><label for="rfCargo">Cargo <span style="font-weight:400">(opcional)</span></label><select id="rfCargo" class="input">${opts(CARGOS,ini.cargo)}</select></div>
    <details class="refbox" ${refs0.length?'open':''}>
      <summary>¿Quiere sumar puntos extra? Déjenos los datos de otras personas de su institución<small>Decanos o más personal de biblioteca · hasta ${MAXREF} personas · opcional</small></summary>
      ${Array.from({length:MAXREF},(_,i)=>{const r=refs0[i]||{};return`<div class="refrow">
        <div class="field"><label for="rfRn${i}">Persona ${i+1}: nombre completo</label><input id="rfRn${i}" class="input" maxlength="100" autocomplete="off" autocapitalize="words" value="${esc(r.name||'')}"></div>
        <div class="two"><div class="field" style="margin:0"><label for="rfRe${i}">Correo</label><input id="rfRe${i}" class="input" maxlength="120" type="email" inputmode="email" autocapitalize="off" spellcheck="false" value="${esc(r.email||'')}"></div>
        <div class="field" style="margin:0"><label for="rfRc${i}">Cargo</label><select id="rfRc${i}" class="input">${opts(CARGOS_REF,r.cargo)}</select></div></div></div>`;}).join('')}
      <p class="note" style="margin:12px 0 0">Indique solo a personas que estén de acuerdo en recibir información de Sage. El bono se aplica por cada persona con nombre y correo válidos.</p>
    </details>
    ${o.withConsent?`<label class="check"><input type="checkbox" id="rfOk" ${ini.consent?'checked':''}><span>${esc(CONSENT_TEXT)}</span></label>`:''}
    <div id="rfErr" class="errbox" hidden role="alert"></div>
    <button type="button" class="btn primary big" id="rfGo">${esc(o.submitLabel)}</button>
  </div>`;
  instBox($('#rfInstHost',host),list,st,()=>{});
  $('#rfGo',host).onclick=()=>{
    const errs=[];
    const raw={
      nombres:$('#rfNom',host).value,apellidos:$('#rfApe',host).value,email:$('#rfMail',host).value,
      institution:st.name,instType:st.type,cargo:$('#rfCargo',host).value,consent:o.withConsent?$('#rfOk',host).checked:!!ini.consent,
      createdAt:ini.createdAt||Date.now(),referrals:[]
    };
    if(clip(raw.institution,200).length<3)errs.push('Indique su institución.');
    if(clip(raw.nombres,80).length<2)errs.push('Escriba sus nombres.');
    if(clip(raw.apellidos,80).length<2)errs.push('Escriba sus apellidos.');
    if(!emailRe.test(clip(raw.email,120)))errs.push('Escriba un correo electrónico válido.');
    if(o.withConsent&&!raw.consent)errs.push('Debe aceptar el tratamiento de datos para participar.');
    for(let i=0;i<MAXREF;i++){
      const n=$('#rfRn'+i,host).value,e=$('#rfRe'+i,host).value,c=$('#rfRc'+i,host).value;
      if(!clip(n,100)&&!clip(e,120))continue;
      if(clip(n,100).length<3||!emailRe.test(clip(e,120))){errs.push('Persona '+(i+1)+': escriba nombre completo y un correo válido, o deje la casilla vacía.');continue;}
      raw.referrals.push({name:n,email:e,cargo:c});
    }
    const box=$('#rfErr',host);
    if(errs.length){box.hidden=false;box.innerHTML=errs.map(x=>'• '+esc(x)).join('<br>');box.scrollIntoView({block:'nearest',behavior:'smooth'});return;}
    const p=cleanPlayer(raw);
    if(!p){box.hidden=false;box.textContent='Revise los datos e intente de nuevo.';return;}
    box.hidden=true;
    o.onSubmit(p);
  };
}

</script>

<script>
/* ================== PÁGINA DE REGISTRO (participante) ================== */
const PASS_KEY='sgp_pass_v1';
const root=$('#reg');
let editing=false;

function loadPass(){try{const r=localStorage.getItem(PASS_KEY);if(!r)return null;const j=JSON.parse(r);const p=cleanPlayer(j);if(p)p.sent=!!j.sent;return p;}catch(e){return null;}}
function savePass(p){try{localStorage.setItem(PASS_KEY,JSON.stringify(p));}catch(e){}}
function clearPass(){try{localStorage.removeItem(PASS_KEY);}catch(e){}}

function header(){
  return `<header class="reg-top"><img class="sagelogo" src="${SAGE_WHITE}" alt="Sage"><span class="rule" aria-hidden="true"></span>
  <div><h1>Tanda de penaltis</h1><p>Bibliotecas y facultades · Ecuador</p></div></header>`;
}
function hero(){
  return `<section class="hero">
    <h2>Regístrese y <span class="ribbon">patee a gol</span></h2>
    <p>Complete sus datos, muestre el código al moderador y reciba <strong>tres lanzamientos</strong>. Elija una cancha, responda y descubra cuánto vale cada recurso para su biblioteca.</p>
    <div class="rm">${['J','B','C'].map(rcardHTML).join('')}</div>
  </section>`;
}
const ERR_MSG={invalid_email:'El correo no es válido.',invalid_data:'Revise sus nombres, apellidos e institución.',consent_required:'Debe aceptar el tratamiento de datos para participar.',too_many:'Hay mucho tráfico en este momento. Intente de nuevo en un minuto.'};
function renderForm(initial){
  root.innerHTML=header()+hero()+`<div class="panel" id="formHost"></div>`;
  regForm($('#formHost'),{initial,submitLabel:initial?'Guardar cambios':'Registrarme',onSubmit:async p=>{
    const prev=loadPass();
    if(prev&&prev.email===p.email)p.createdAt=prev.createdAt;
    if(!sbReady()){savePass(p);editing=false;renderPass(p);window.scrollTo({top:0,behavior:'smooth'});return;}
    const btn=$('#rfGo'),box=$('#rfErr'),label=btn.textContent;
    btn.disabled=true;btn.textContent='Enviando…';box.hidden=true;
    try{
      await sbRpc('register_participant',{p:{nombres:p.nombres,apellidos:p.apellidos,email:p.email,institution:p.institution,instType:p.instType,cargo:p.cargo,consent:p.consent,referrals:p.referrals}});
      p.sent=true;savePass(p);editing=false;renderDone(p);window.scrollTo({top:0,behavior:'smooth'});
    }catch(e){
      btn.disabled=false;btn.textContent=label;
      const known=ERR_MSG[e.message];
      if(known){box.hidden=false;box.textContent=known;return;}
      /* sin conexión o servicio no disponible: se ofrece el código QR como respaldo */
      p.sent=false;savePass(p);
      box.hidden=false;
      box.innerHTML='No se pudo enviar su registro (revise su conexión). <button type="button" class="btn sm" id="useQr" style="margin-top:8px">Usar código QR de respaldo</button>';
      $('#useQr').onclick=()=>{renderPass(p,true);window.scrollTo({top:0});};
      box.scrollIntoView({block:'nearest',behavior:'smooth'});
    }
  }});
}
function renderDone(p){
  const refs=(p.referrals||[]).length;
  root.innerHTML=header()+`<div class="panel pass">
    <h2>¡Listo, ${esc(p.nombres.split(' ')[0])}!</h2>
    <p style="margin:0">Su registro quedó guardado. Acérquese al moderador y dígale su nombre para activar sus tres lanzamientos.</p>
    <div class="meta" style="margin-top:16px"><strong>${esc(p.name)}</strong>${esc(p.institution)}${p.cargo?'<br>'+esc(p.cargo):''}<br>${esc(p.email)}${refs?`<br><span class="chip" style="margin-top:8px">${refs} contacto${refs>1?'s':''} adicional${refs>1?'es':''} · puntos extra</span>`:''}</div>
    <div class="steps">
      <div><b>1</b><span>Acérquese al moderador y dígale su nombre completo.</span></div>
      <div><b>2</b><span>Elija su cancha: revistas, libros (modelo EBA) o Business Cases.</span></div>
      <div><b>3</b><span>Patee, responda y sume puntos para su institución.</span></div>
    </div>
    <div class="row" style="justify-content:center"><button class="btn" id="edit">Corregir mis datos</button><button class="btn ghost" id="other">Registrar a otra persona</button></div>
  </div>`;
  $('#edit').onclick=()=>{editing=true;renderForm(p);window.scrollTo({top:0});};
  $('#other').onclick=async()=>{if(await confirmBox('Registrar a otra persona','Este celular dejará de mostrar el registro de '+p.name+'.','Continuar')){clearPass();renderForm(null);window.scrollTo({top:0});}};
}
function renderPass(p,offline){
  const code=encodePass(p);
  const svg=qrSVG(code);
  const refs=(p.referrals||[]).length;
  root.innerHTML=header()+`<div class="panel pass">
    <h2>¡Listo, ${esc(p.nombres.split(' ')[0])}!</h2>
    <p style="margin:0">${offline?'No hubo conexión con el servidor. ':''}Muestre este código al moderador para activar sus tres lanzamientos.</p>
    <div class="qrbox">${svg||'<p style="color:#001A69;font-size:14px;padding:18px">No se pudo dibujar el QR en este dispositivo. Use el código de texto de abajo.</p>'}</div>
    <div class="meta"><strong>${esc(p.name)}</strong>${esc(p.institution)}${p.cargo?'<br>'+esc(p.cargo):''}<br>${esc(p.email)}${refs?`<br><span class="chip" style="margin-top:8px">${refs} contacto${refs>1?'s':''} adicional${refs>1?'es':''} · puntos extra</span>`:''}</div>
    <div class="steps">
      <div><b>1</b><span>Suba el brillo de la pantalla.</span></div>
      <div><b>2</b><span>Acérquese al moderador y muéstrele este código.</span></div>
      <div><b>3</b><span>Elija su cancha: revistas, libros (modelo EBA) o Business Cases.</span></div>
    </div>
    <details style="text-align:left;margin-bottom:14px"><summary class="note" style="cursor:pointer">¿El QR no se lee? Use el código de texto</summary>
      <textarea class="input" rows="4" readonly id="codeTxt" style="margin-top:8px">${esc(code)}</textarea>
      <button class="btn sm" id="copyCode" style="margin-top:8px">Copiar código</button></details>
    <div class="row" style="justify-content:center"><button class="btn" id="edit">Editar mis datos</button><button class="btn ghost" id="other">Registrar a otra persona</button></div>
  </div>`;
  $('#edit').onclick=()=>{editing=true;renderForm(p);window.scrollTo({top:0});};
  $('#other').onclick=async()=>{if(await confirmBox('Registrar a otra persona','Este celular dejará de mostrar el código de '+p.name+'. Asegúrese de que ya fue leído por el moderador.','Continuar')){clearPass();renderForm(null);window.scrollTo({top:0});}};
  $('#copyCode').onclick=async()=>{const ta=$('#codeTxt');ta.select();try{await navigator.clipboard.writeText(code);toast('Código copiado');}catch(e){try{document.execCommand('copy');toast('Código copiado');}catch(_){toast('Selecciónelo y cópielo manualmente');}}};
}
(function init(){const p=loadPass();if(!p)renderForm(null);else if(p.sent)renderDone(p);else renderPass(p);})();

</script>
